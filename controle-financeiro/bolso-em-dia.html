<title>Bolso em Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: app de finanças pessoais — barra lateral no notebook, barra inferior + botão "+" no celular; cartões por função, números tabulares. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#101A2C; --muted:#586477; --line:#D9DFE8;
  --accent:#1D4ED0; --accent-soft:#E2E9FB; --on-accent:#FFFFFF;
  --pos:#08865A; --pos-soft:#DCF2E8; --neg:#C33B2B; --neg-soft:#FAE3DF; --warn:#A86B12; --warn-soft:#FAEFD9;
  --g-ess:#1D4ED0; --g-est:#D27A22; --g-fin:#B03558; --g-fut:#0D8C82;
  --shadow:0 1px 2px rgba(16,26,44,.05),0 6px 20px rgba(16,26,44,.05);
  --f-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111E; --surface:#111A2A; --surface-2:#192439; --ink:#E6EBF3; --muted:#93A0B4; --line:#25324A;
  --accent:#7196FF; --accent-soft:#1A2850; --on-accent:#0A111E;
  --pos:#3FCB8F; --pos-soft:#0F3527; --neg:#FF7B69; --neg-soft:#3D1B17; --warn:#EFB351; --warn-soft:#382A10;
  --g-ess:#7196FF; --g-est:#EF9F4C; --g-fin:#E46E8F; --g-fut:#36C3B6;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A111E; --surface:#111A2A; --surface-2:#192439; --ink:#E6EBF3; --muted:#93A0B4; --line:#25324A;
  --accent:#7196FF; --accent-soft:#1A2850; --on-accent:#0A111E;
  --pos:#3FCB8F; --pos-soft:#0F3527; --neg:#FF7B69; --neg-soft:#3D1B17; --warn:#EFB351; --warn-soft:#382A10;
  --g-ess:#7196FF; --g-est:#EF9F4C; --g-fin:#E46E8F; --g-fut:#36C3B6;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:1.6rem}
h2{font-size:1.05rem}
h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warnc{color:var(--warn)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:none}
main{min-width:0;padding-block:18px 120px;max-width:1180px;width:100%;margin-inline:auto}
@media (min-width:920px){
  .app{grid-template-columns:220px minmax(0,1fr);gap:28px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding-block:22px;overflow:auto}
  main{padding-block:26px 60px}
  .tabbar,.fab{display:none!important}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem}
.brand b{font-family:var(--f-display);font-size:1.05rem}
.nav-a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav-a svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav-a:hover{background:var(--surface-2)}
.nav-a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-a[aria-current="page"] svg{color:var(--accent)}
.nav-sep{height:1px;background:var(--line);margin:10px 10px}
.side .btn{margin:6px 10px 10px}
.sync{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--pos)} .dot.wait{background:var(--warn)} .dot.err{background:var(--neg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer}
.tabbar svg{width:22px;height:22px}
.tabbar [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px rgba(29,78,208,.35);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}

/* ---------- page header ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.ph h1{margin-top:2px}
.mesnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.mesnav-l{min-width:136px;text-align:center;font-weight:600;font-family:var(--f-display);font-size:.95rem}
.ib{width:34px;height:34px;border-radius:9px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;font-size:1.1rem;color:var(--ink)}
.ib:hover{background:var(--surface-2)}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:6px 8px;border-radius:8px}
.lnk:hover{background:var(--accent-soft)}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr}
@media (min-width:1080px){.g2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{font-size:.82rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.35rem;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dang{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.pend{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--neg-soft);color:var(--neg)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:.9rem}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.9rem}
.banner b{color:var(--warn)}
.card.alerta{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn-soft) 55%,var(--surface))}
.badge{position:absolute;top:0;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--neg);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center}
.tabbar a{position:relative}

/* quick add */
.quick{display:flex;gap:8px;margin-bottom:6px}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem}
.quick input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.qprev{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;margin-bottom:16px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.bar-row .n{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.bar-row .meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted)}
.track{grid-column:1/-1;position:relative;height:8px;border-radius:99px;background:var(--surface-2)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.limit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack > span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:.8rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* big available */
.avail .big{font-family:var(--f-display);font-size:2.1rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.avail .split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:14px;font-size:.84rem}
@media (max-width:520px){.avail .split{grid-template-columns:1fr}}
.avail .split div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:8px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:.78rem;font-weight:700;flex:none;font-family:var(--f-display)}
.li .tx{flex:1;min-width:0}
.li .t1,.li .t2{display:block}
.li .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .am{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.dayh{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 4px 4px}

.insights{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.insights li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent)}
.insights li.warn::before{background:var(--warn)}
.insights li.good::before{background:var(--pos)}
.ai-out{white-space:pre-wrap;font-size:.9rem;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-top:12px}

.prog{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog > span{display:block;height:100%;background:var(--accent);border-radius:99px}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
tr.tot td{font-weight:700;border-bottom:0}

.cards3{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0}
.filters input{flex:1 1 200px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button,.seg label{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg [aria-pressed="true"],.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg label{padding:0}.seg label span{display:block;padding:6px 14px;border-radius:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}

svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:50}
.sh-back{position:absolute;inset:0;background:rgba(6,10,20,.45)}
.sh-panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:720px){.sh-panel{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:88vh;border-radius:18px;padding:0 22px 22px}}
.sh-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;z-index:1}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:.8rem;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fld.big input{font-family:var(--f-display);font-size:1.5rem;font-weight:600;padding:10px 12px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.form-actions .pri{flex:1}
.hint{font-size:.78rem;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:8px}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:8px;align-items:center}
.item-row input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs button{font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px dashed var(--line);background:none;cursor:pointer;color:var(--muted)}
.sugs button:hover{border-color:var(--accent);color:var(--accent)}

.chatlog{display:flex;flex-direction:column;gap:8px;max-height:min(46vh,420px);min-height:120px;overflow-y:auto;padding:4px 2px}
.bub{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.9rem;line-height:1.45}
.bub.eu{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;white-space:pre-wrap}
.bub.app{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (min-width:920px){#toast{bottom:28px}}
.loading{padding:60px 10px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fill,.prog>span{transition:width .4s ease}}
</style>

<div class="app">
  <aside class="side" aria-label="Navegação">
    <div class="brand"><span class="brand-mark">R$</span><b>Bolso em Dia</b></div>
    <button class="btn pri" data-a="novo">+ Novo lançamento</button>
    <nav id="sidenav"></nav>
    <div class="sync"><span class="dot wait" id="syncdot"></span><span id="synctx">Conectando…</span></div>
  </aside>
  <main id="main"><div class="loading">Carregando seu controle financeiro…</div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navegação"></nav>
<button class="fab" data-a="novo" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(() => {
'use strict';
/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fBRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const fBRL0 = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const brl = v => fBRL.format(+v || 0);
const brl0 = v => fBRL0.format(+v || 0);
const pct = v => (isFinite(v) ? Math.round(v * 100) : 0) + '%';
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => isoDate(new Date());
const ymNow = () => hoje().slice(0, 7);
const addM = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const monthsBetween = (a, b) => { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${MES[m-1]}/${y.slice(2)}`; };
const ymLong = ym => { const [y, m] = ym.split('-'); return `${MESL[m-1]} ${y}`; };

function resumo(m) {
  const L = S.lanc.filter(l => l.mes === m);
  const D = L.filter(l => l.tipo !== 'receita'), R = L.filter(l => l.tipo === 'receita');
  const desp = sum(D), rec = sum(R);
  const fixoD = sum(D.filter(isFixo));
  const parcD = sum(D.filter(l => (+l.nparc || 1) > 1 && !isFixo(l)));
  const pend = pendentesMes(m);
  const porCat = {}; D.forEach(l => { porCat[l.cat || 'Outros'] = (porCat[l.cat || 'Outros'] || 0) + (+l.valor || 0); });
  const porGrupo = {essencial:0, estilo:0, financeiro:0};
  Object.entries(porCat).forEach(([c, v]) => { porGrupo[grupoDe(c)] = (porGrupo[grupoDe(c)] || 0) + v; });
  const vaRec = sum(R.filter(isVARec)) + sum(pend.filter(p => p.tipo === 'receita' && p.cat === 'Vale alimentação'));
  const vaDesp = sum(D.filter(isVA)) + sum(pend.filter(p => p.tipo === 'despesa' && p.ref.meio === 'va'));
  const extras = sum(R.filter(l => EXTRAS.includes(l.cat)));
  return {m, L, D, R, desp, rec, fixoD, parcD, varD: desp - fixoD - parcD, pend,
    pendD: sum(pend.filter(p => p.tipo === 'despesa')), pendR: sum(pend.filter(p => p.tipo === 'receita')),
    guard: guardadoMes(m), porCat, porGrupo, vaRec, vaDesp, extras};
}
function mediaCat(m, n = 3) {
  const out = {}; const meses = [];
  for (let i = 1; i <= n; i++) meses.push(addM(m, -i));
  const comDados = meses.filter(x => S.lanc.some(l => l.mes === x && l.tipo !== 'receita'));
  if (!comDados.length) return {media:{}, n:0, desp:0};
  comDados.forEach(x => S.lanc.forEach(l => { if (l.mes === x && l.tipo !== 'receita') out[l.cat || 'Outros'] = (out[l.cat || 'Outros'] || 0) + (+l.valor || 0); }));
  Object.keys(out).forEach(k => out[k] /= comDados.length);
  const desp = comDados.reduce((s, x) => s + sum(S.lanc.filter(l => l.mes === x && l.tipo !== 'receita')), 0) / comDados.length;
  return {media: out, n: comDados.length, desp};
}

/* ---------- categorização automática ---------- */
let _learn = null;
function learned() {
  if (_learn) return _learn;
  _learn = new Map();
  [...S.lanc].sort((a, b) => String(a.criado || '').localeCompare(String(b.criado || ''))).forEach(l => { if (l.desc && l.cat) _learn.set(`${l.tipo === 'receita' ? 'r' : 'd'}|${norm(l.desc)}`, l.cat); });
  return _learn;
}
function autoCat(desc, tipo = 'despesa') {
  const d = norm(desc); if (!d) return null;
  const key = `${tipo === 'receita' ? 'r' : 'd'}|${d}`;
  if (learned().has(key)) return learned().get(key);
  const hay = ` ${d.replace(/[^\w&\s]/g, ' ')} `;
  let best = null, bestLen = 0;
  (tipo === 'receita' ? catsRec() : catsDesp()).forEach(c => String(c.k || '').split(',').map(norm).filter(Boolean).forEach(kw => {
    if (hay.includes(` ${kw}`) && kw.length > bestLen) { best = c.n; bestLen = kw.length; }
  }));
  return best;
}
async function aiCategorizar(id, desc, tipo) {
  if (!S.sample || !desc) return;
  const lista = (tipo === 'receita' ? catsRec() : catsDesp()).map(c => c.n);
  try {
    const r = await S.sample.json(`Você categoriza lançamentos de um controle financeiro pessoal brasileiro. Lançamento (${tipo}): "${desc}". Escolha a categoria mais provável desta lista exata: ${JSON.stringify(lista)}. Responda só com JSON no formato {"cat":"<nome exato da lista>"}.`, {modelTier:'quick'});
    const cat = r && lista.includes(r.cat) ? r.cat : null;
    const l = S.lanc.find(x => x.id === id);
    if (cat && l && cat !== l.cat && (l.cat === 'Outros' || l.cat === 'Outras receitas')) {
      await put(COLS.lanc, id, {...strip(l), cat});
      toast(`Categoria sugerida: ${cat}`);
    }
  } catch (e) { if (e && ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) S.sample = null; }
}

/* ---------- interpretação do texto rápido ---------- */
function parseRapido(txt) {
  const r = {tipo:'despesa', data:hoje(), meio:S.cfg.meioPadrao || 'pix', cartaoId:null, nparc:1, valor:NaN, desc:'', cat:null};
  let t = ` ${txt} `;
  if (/^\s*\+/.test(t)) { r.tipo = 'receita'; t = t.replace(/^\s*\+/, ' '); }
  if (/\b(recebi|ganhei|entrou|salario|sal[aá]rio)\b/i.test(t)) r.tipo = 'receita';
  t = t.replace(/\b(\d{1,2})\s*x\b/i, (_, n) => { r.nparc = clamp(+n, 1, 48); return ' '; });
  t = t.replace(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/, (_, d, m, y) => {
    const now = new Date(); let yy = y ? +y : now.getFullYear(); if (yy < 100) yy += 2000;
    const dt = new Date(yy, +m - 1, +d); if (!isNaN(dt)) r.data = isoDate(dt); return ' ';
  });
  t = t.replace(/\b(anteontem|ontem|hoje)\b/i, w => { const dt = new Date(); const k = w.toLowerCase(); if (k === 'ontem') dt.setDate(dt.getDate() - 1); if (k === 'anteontem') dt.setDate(dt.getDate() - 2); r.data = isoDate(dt); return ' '; });
  const mv = t.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(?![\w\/])/i);
  if (mv) { r.valor = parseValor(mv[1]); t = t.replace(mv[0], ' '); }
  const n = norm(t);
  let card = null;
  S.cartoes.forEach(c => { const cn = norm(c.nome); if (cn && (` ${n} `).includes(` ${cn}`)) card = c; });
  if (!card && /\b(credito|cartao|cc)\b/.test(n) && S.cartoes.length === 1) card = S.cartoes[0];
  let explicit = true;
  const isDeb = /\bdebito\b/.test(n);
  if (card && !isDeb) { r.meio = 'credito'; r.cartaoId = card.id; t = t.replace(new RegExp(card.nome.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), ' '); }
  else if (/\b(va|vale|vr|alelo|sodexo|pluxee|caju)\b/.test(n) && r.tipo !== 'receita') r.meio = 'va';
  else if (/\bpix\b/.test(n)) r.meio = 'pix';
  else if (isDeb) { r.meio = 'debito'; if (card) t = t.replace(new RegExp(card.nome.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), ' '); }
  else if (/\bdinheiro\b/.test(n)) r.meio = 'dinheiro';
  else if (/\bboleto\b/.test(n)) r.meio = 'boleto';
  else explicit = false;
  t = t.replace(/\b(pix|d[eé]bito|dinheiro|boleto|cr[eé]dito|cart[aã]o|no cart[aã]o|cc)\b/gi, ' ');
  if (r.meio === 'va') t = t.replace(/\b(no |com )?(va|vale|vr|alelo|sodexo|pluxee|caju)\b/gi, ' ');
  t = t.replace(/^\s*(gastei|paguei|comprei|recebi|ganhei|entrou)\b/i, ' ');
  t = t.replace(/\b(r\$|reais|conto|pila)\b/gi, ' ');
  t = t.replace(/^\s*(no|na|em|de|do|da|com|pra|para|pro)\s+/i, ' ').replace(/\s+(no|na|em|de|do|da|com|pra|para|pro)\s*$/i, ' ');
  r.desc = t.replace(/\s+/g, ' ').trim();
  r.desc = r.desc.charAt(0).toUpperCase() + r.desc.slice(1);
  if (r.tipo === 'receita' && !r.desc) r.desc = 'Receita';
  r.cat = autoCat(r.desc, r.tipo) || (r.tipo === 'receita' ? 'Outras receitas' : 'Outros');
  r.catAuto = !autoCat(r.desc, r.tipo);
  if (!explicit && r.tipo !== 'receita' && vaCats().includes(r.cat)) r.meio = 'va';
  return r;
}

/* ---------- gravação de lançamentos ---------- */
async function criarLanc(o) {
  const base = {tipo:o.tipo, desc:o.desc || (o.tipo === 'receita' ? 'Receita' : 'Gasto'), cat:o.cat, data:o.data, meio:o.meio,
    criado:new Date().toISOString()};
  if (S.uid) base.por = S.uid;
  if (o.cartaoId) base.cartaoId = o.cartaoId;
  if (o.objId) { base.objId = o.objId; if (o.objItem) base.objItem = o.objItem; }
  if (o.obs) base.obs = o.obs;
  if (o.fixoId) base.fixoId = o.fixoId;
  if (o.empId) base.empId = o.empId;
  const c = o.cartaoId ? cartao(o.cartaoId) : null;
  const mes0 = o.mes || (c ? mesFatura(o.data, c) : o.data.slice(0, 7));
  const n = o.tipo === 'despesa' ? clamp(+o.nparc || 1, 1, 48) : 1;
  const ids = [];
  if (n === 1) { ids.push(await put(COLS.lanc, null, {...base, valor:r2(o.valor), mes:mes0})); }
  else {
    const grupo = uid(); const vp = r2(o.valor / n);
    for (let i = 0; i < n; i++) {
      const v = i === n - 1 ? r2(o.valor - vp * (n - 1)) : vp;
      ids.push(await put(COLS.lanc, null, {...base, valor:v, mes:addM(mes0, i), grupo, parc:i + 1, nparc:n, total:r2(o.valor)}));
    }
  }
  _learn = null;
  return ids;
}

}
function insights(r, med) {
  const out = []; const m = r.m;
  const cats = Object.entries(r.porCat).sort((a, b) => b[1] - a[1]);
  if (cats.length && r.desp > 0) out.push({t:'info', h:`<b>${esc(cats[0][0])}</b> é onde mais saiu dinheiro: ${brl(cats[0][1])}, ${pct(cats[0][1] / r.desp)} das despesas.`});
  const orc = S.cfg.orc || {};
  cats.forEach(([c, v]) => { const lim = +orc[c]; if (!r.D.some(l => l.cat === c && !isFixo(l))) return; if (lim > 0 && v > lim + .5) out.push({t:'warn', h:`Orçamento de <b>${esc(c)}</b> estourado em ${brl(v - lim)} (${brl(v)} de ${brl(lim)}).`}); else if (lim > 0 && v > lim * .8) out.push({t:'warn', h:`<b>${esc(c)}</b> já usou ${pct(v / lim)} do orçamento de ${brl0(lim)}.`}); });
  if (med.n) cats.forEach(([c, v]) => { const me = med.media[c] || 0; if (me > 0 && v > me * 1.25 && v - me > 50) out.push({t:'warn', h:`<b>${esc(c)}</b> está ${pct(v / me - 1)} acima da sua média (+${brl(v - me)}).`}); });
  const recBase = r.rec + r.pendR, fixT = r.fixoD + r.pendD;
  if (recBase > 0 && fixT > 0) { const s = fixT / recBase; out.push({t:s > .6 ? 'warn' : s > .5 ? 'info' : 'good', h:`Contas fixas e empréstimos levam <b>${pct(s)}</b> da renda do mês. ${s > .5 ? 'Acima de 50% sobra pouca margem para imprevistos.' : 'Faixa saudável.'}`}); }
  const prox = addM(m, 1); const pn = sum(S.lanc.filter(l => l.mes === prox && (+l.nparc || 1) > 1 && l.tipo !== 'receita'));
  if (pn > 0) out.push({t:'info', h:`Já existem ${brl(pn)} em parcelas para ${ymLabel(prox)}. Antes de parcelar algo novo, some isso à conta.`});
  const ass = sum(fixosAtivos(m).filter(f => f.cat === 'Assinaturas' && f.tipo !== 'receita')) || r.porCat['Assinaturas'] || 0;
  if (ass > 0) out.push({t:'info', h:`Assinaturas: ${brl(ass)} por mês, <b>${brl(ass * 12)} por ano</b>. Cancele as que usa pouco.`});
  const peq = r.D.filter(l => +l.valor <= 30 && !isFixo(l));
  if (peq.length >= 6) out.push({t:'info', h:`${peq.length} gastos pequenos (até R$ 30) somaram <b>${brl(sum(peq))}</b>.`});
  const deliv = r.D.filter(l => /ifood|rappi|delivery|ze delivery|aiqfome/i.test(norm(l.desc)));
  if (deliv.length >= 3) out.push({t:'info', h:`${deliv.length} pedidos de delivery: ${brl(sum(deliv))}. Cozinhar 2 dessas vezes economizaria uns ${brl0(sum(deliv) / deliv.length * 2)}.`});
  if (r.extras > 0) { const sem = (r.rec - r.extras) - r.desp; out.push({t:sem < 0 ? 'warn' : 'info', h:`Este mês entraram ${brl(r.extras)} de extras (PLR, 13º, férias…). ${sem < 0 ? `Sem eles o mês fecharia em <b>${brl(sem)}</b>. Use extras para guardar ou quitar dívidas, não para o dia a dia.` : 'Sem eles o mês ainda fecharia no azul.'}`}); }
  const cartaoSem = r.porCat['Cartão (sem detalhe)'] || 0;
  if (cartaoSem > 0 && r.desp > 0) out.push({t:'warn', h:`${brl(cartaoSem)} (${pct(cartaoSem / r.desp)}) são fatura de cartão sem detalhe. Lance cada compra para saber onde esse dinheiro vai.`});
  if (r.rec > 0) { const tx = (r.rec - r.desp) / r.rec, meta = metaPoup() / 100; out.push({t:tx >= meta ? 'good' : 'warn', h:tx >= meta ? `Sobrou ${pct(tx)} da renda, acima da meta de ${pct(meta)}.` : `Sobrou ${pct(Math.max(tx, 0))} da renda até agora. A meta é guardar ${pct(meta)}.`}); }
  const reserva = S.inv.filter(i => i.tipo === 'Reserva de emergência').reduce((s, i) => s + saldoInv(i), 0);
  const custo = med.desp || r.desp;
  if (custo > 0) { const meses = reserva / custo; out.push({t:meses >= 6 ? 'good' : 'warn', h:reserva > 0 ? `Sua reserva de emergência cobre <b>${meses.toLocaleString('pt-BR', {maximumFractionDigits:1})} meses</b> de gastos. O recomendado é 6.` : `Você ainda não tem reserva de emergência cadastrada. A meta é ${brl0(custo * 6)} (6 meses de gastos).`}); }
  return out;
}

/* ---------- ANUAL ---------- */
function vAnual() {

    <div class="kpi"><div class="eyebrow">Despesas no ano</div><div class="v">${brl(tD)}</div><div class="s">média ${brl(comDados.length ? tD / comDados.length : 0)}/mês</div></div>
    <div class="kpi"><div class="eyebrow">Guardado no ano</div><div class="v" style="color:var(--g-fut)">${brl(tG)}</div><div class="s">sobrou ${pct(tR ? (tR - tD) / tR : 0)} da renda</div></div>
    <div class="kpi"><div class="eyebrow">Mês mais caro</div><div class="v">${maior ? ymLabel(maior.m) : '—'}</div><div class="s">${maior ? brl(maior.desp) : 'sem dados'}</div></div></div>`;

    ${rows.map((r, i) => { const x = pl + i * bw; const w = bw * .32; return `<rect x="${x + bw * .16}" y="${y0(r.rec)}" width="${w}" height="${Math.max(0, y0(0) - y0(r.rec))}" rx="3" fill="var(--pos)"><title>${ymLabel(r.m)} receitas ${brl(r.rec)}</title></rect><rect x="${x + bw * .16 + w + 2}" y="${y0(r.desp)}" width="${w}" height="${Math.max(0, y0(0) - y0(r.desp))}" rx="3" fill="var(--neg)" opacity=".85"><title>${ymLabel(r.m)} despesas ${brl(r.desp)}</title></rect><text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" ${r.m === ymNow() ? 'style="fill:var(--ink);font-weight:600"' : ''}>${MES[i]}</text>`; }).join('')}
  </svg>`;
  h += `<section class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>Receitas × despesas</h2></div><div class="legend" style="margin:0"><span><i style="background:var(--pos)"></i>Receitas</span><span><i style="background:var(--neg)"></i>Despesas</span></div></div>${svg}</section>`;
  // tabela
  let acc = 0;
  h += `<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Fechamento mensal</h2></div><div class="tbl-wrap"><table><thead><tr><th>Mês</th><th>Receitas</th><th>Extras</th><th>Despesas</th><th>Sobra</th><th>% guardado</th><th>Investido</th><th>Saldo acumulado</th></tr></thead><tbody>${rows.map(r => { const s = r.rec - r.desp; acc += s; return `<tr><td><button class="lnk" style="padding:2px 0" data-a="irMes" data-m="${r.m}">${MESL[+r.m.slice(5) - 1]}</button></td><td class="pos">${r.rec ? brl(r.rec) : '—'}</td><td class="muted">${r.extras ? brl(r.extras) : '—'}</td><td>${r.desp ? brl(r.desp) : '—'}</td><td class="${s < 0 ? 'neg' : ''}">${r.rec || r.desp ? brl(s) : '—'}</td><td>${r.rec ? pct(s / r.rec) : '—'}</td><td>${r.guard ? brl(r.guard) : '—'}</td><td class="${acc < 0 ? 'neg' : ''}">${r.rec || r.desp ? brl(acc) : ''}</td></tr>`; }).join('')}<tr class="tot"><td>Total</td><td class="pos">${brl(tR)}</td><td>${brl(tE)}</td><td>${brl(tD)}</td><td>${brl(tR - tD)}</td><td>${tR ? pct((tR - tD) / tR) : '—'}</td><td>${brl(tG)}</td><td></td></tr></tbody></table></div></section>`;
  // heatmap
  const catTot = {}; rows.forEach(r => Object.entries(r.porCat).forEach(([c, v]) => { catTot[c] = (catTot[c] || 0) + v; }));
  const cats = Object.entries(catTot).sort((a, b) => b[1] - a[1]);
  const cmax = Math.max(1, ...rows.flatMap(r => Object.values(r.porCat)));
  h += `<section class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>Categorias mês a mês</h2><p>Quanto mais forte a cor, maior o gasto. Procure as linhas que crescem.</p></div></div>${cats.length ? `<div class="tbl-wrap"><table><thead><tr><th>Categoria</th>${MES.map(m => `<th>${m}</th>`).join('')}<th>Total</th><th>Média</th></tr></thead><tbody>${cats.map(([c, t]) => `<tr><td>${esc(c)}</td>${rows.map(r => { const v = r.porCat[c] || 0; return `<td style="background:${v ? `color-mix(in srgb, var(--neg) ${Math.round(8 + v / cmax * 55)}%, var(--surface))` : 'transparent'}">${v ? kfmt(v) : ''}</td>`; }).join('')}<td><b>${brl0(t)}</b></td><td>${brl0(t / Math.max(1, comDados.length))}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sem despesas neste ano.</div>'}</section>`;
  // compromissos futuros
  const fut = Array.from({length:12}, (_, i) => {

    const fx = sum(fixosAtivos(m).filter(f => f.tipo !== 'receita' && !pagoFixo(f, m)), f => f.valor) + sum(fixosAtivos(m).filter(f => f.tipo !== 'receita' && pagoFixo(f, m)), f => pagoFixo(f, m).valor);
    const em = sum(empsAtivos(m).filter(e => e.direcao !== 'receber'), e => e.parcela);
    const rf = sum(fixosAtivos(m).filter(f => f.tipo === 'receita'), f => f.valor);
    return {m, parc, fx, em, rf, tot:parc + fx + em};
  });
  const fmx = Math.max(1, ...fut.map(f => Math.max(f.tot, f.rf)));
  h += `<section class="card"><div class="card-h"><div><h2>Já comprometido nos próximos 12 meses</h2><p>Contas fixas + parcelas de cartão + empréstimos, antes de qualquer gasto novo</p></div></div>
    <div class="bars">${fut.map(f => `<div class="bar-row"><span class="n">${ymLabel(f.m)}</span><span class="v">${brl(f.tot)}${f.rf ? ` <span class="muted small">de ${brl0(f.rf)}</span>` : ''}</span><div class="stack" style="grid-column:1/-1;height:10px;width:${(f.tot / fmx * 100).toFixed(1)}%;min-width:2px"><span style="width:${f.tot ? f.fx / f.tot * 100 : 0}%;background:var(--g-ess)"></span><span style="width:${f.tot ? f.parc / f.tot * 100 : 0}%;background:var(--g-est)"></span><span style="width:${f.tot ? f.em / f.tot * 100 : 0}%;background:var(--g-fin)"></span></div></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--g-ess)"></i>Contas fixas</span><span><i style="background:var(--g-est)"></i>Parcelas de cartão</span><span><i style="background:var(--g-fin)"></i>Empréstimos</span></div></section>`;
  return h;
}

/* ---------- roteamento ---------- */
const RENDER = {inicio:vInicio, extrato:vExtrato, fixos:vFixos, cartoes:vCartoes, emprestimos:vEmprestimos, investimentos:vInvest, objetivos:vObjetivos, anual:vAnual, ajustes:vAjustes};
let _raf = 0;
function render() { cancelAnimationFrame(_raf); _raf = requestAnimationFrame(doRender); }
function doRender() {
  renderNav();
  const main = $('#main');
  if (S.blocked) { main.innerHTML = `<div class="loading"><h2>Este controle financeiro é privado</h2><p style="margin-top:8px">Só o dono consegue ver e editar os dados.</p></div>`; return; }
  if (!S.db && !S.failed) { main.innerHTML = '<div class="loading">Carregando seu controle financeiro…</div>'; return; }
  if (S.failed) { main.innerHTML = '<div class="loading"><h2>Não consegui acessar seus dados</h2><p style="margin-top:8px">Abra este controle pelo claude.ai, com sua conta conectada, e recarregue a página.</p></div>'; return; }
  const ae = document.activeElement; const keep = ae && ae.id && main.contains(ae) ? {id:ae.id, s:ae.selectionStart, e:ae.selectionEnd, v:ae.value} : null;
  main.innerHTML = (RENDER[S.view] || vInicio)();
  if (keep) { const el = document.getElementById(keep.id); if (el) { if (keep.v != null && 'value' in el) el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (_) {} if (keep.id === 'q-rapido') previewRapido(); } }
}
function route() {
  const k = location.hash.replace('#', '');
  S.view = RENDER[k] ? k : 'inicio';
  closeSheet(); render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ================= sheet (painel) ================= */
function openSheet(title, body, mount) {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sh-back" data-a="closeSheet"></div><div class="sh-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh-head"><h2>${esc(title)}</h2><button class="ib" data-a="closeSheet" aria-label="Fechar">✕</button></div><div class="sh-body">${body}</div></div>`;
  sh.hidden = false; document.body.classList.add('noscroll');
  if (mount) mount(sh);
  const f = sh.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 40);
}
function closeSheet() { const sh = $('#sheet'); sh.hidden = true; sh.innerHTML = ''; document.body.classList.remove('noscroll'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

const opt = (v, n, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(n)}</option>`;
const meioOpts = (meio, cartaoId) => Object.entries(MEIOS).map(([k, n]) => opt(k, n, !cartaoId && meio === k)).join('') + S.cartoes.map(c => opt('cc:' + c.id, 'Crédito · ' + c.nome, cartaoId === c.id)).join('');
const catOpts = (tipo, sel) => (tipo === 'receita' ? catsRec() : catsDesp()).map(c => opt(c.n, c.n, c.n === sel)).join('');
const fv = v => (v == null || v === '' || isNaN(v)) ? '' : String(r2(+v)).replace('.', ',');

/* ---------- formulário de lançamento ---------- */
function formLanc(l = {}, opts = {}) {

Regras: um item por gasto ou receita citado. "valor" em reais como número (se for parcelado, o valor TOTAL). "data" em AAAA-MM-DD; interprete ontem, sexta etc. a partir de hoje; padrão hoje. "nparc" = número de parcelas (padrão 1). Se citar um cartão de crédito ou "crédito", use meio "credito" e "cartao" com o nome exato da lista; se citar débito, meio "debito" mesmo que cite o banco. Se não disser a forma de pagamento, meio null. "desc" curta, com inicial maiúscula. Salário, vale, PLR, 13º, férias, reembolso e dinheiro recebido são receitas.

    const tipo = it.tipo === 'receita' ? 'receita' : 'despesa';

}

// pagar contas fixas / empréstimos
function lancDePendente(kind, ref, m, valor, data) {
  if (kind === 'fixo') return {tipo:ref.tipo || 'despesa', valor:valor ?? +ref.valor, desc:ref.desc, cat:ref.cat || 'Outros', data:data || `${m}-${pad(Math.min(+ref.dia || 1, diasNoMes(m)))}`, meio:ref.meio || 'pix', cartaoId:ref.cartaoId || null, fixoId:ref.id, mes:m};
  return {tipo:ref.direcao === 'receber' ? 'receita' : 'despesa', valor:valor ?? +ref.parcela, desc:`${ref.desc} (${parcNum(ref, m)}/${ref.n})`, cat:ref.direcao === 'receber' ? 'Outras receitas' : (ref.cat || 'Dívidas & juros'), data:data || `${m}-${pad(Math.min(+ref.dia || 1, diasNoMes(m)))}`, meio:'boleto', empId:ref.id, mes:m};
}
A.pagar = el => {
  const kind = el.dataset.kind, m = el.dataset.m || S.mes;
  const ref = kind === 'fixo' ? S.fixos.find(f => f.id === el.dataset.id) : S.emps.find(e => e.id === el.dataset.id);
  if (!ref) return;
  const base = lancDePendente(kind, ref, m);
  openSheet(base.tipo === 'receita' ? 'Confirmar recebimento' : 'Confirmar pagamento', `<form class="form" data-f="pagar"><input type="hidden" name="kind" value="${kind}"><input type="hidden" name="m" value="${m}"><input type="hidden" name="id" value="${ref.id}">
    <p class="muted">${esc(ref.desc)} · ${ymLong(m)}</p>
    <label class="fld big"><span>Valor ${base.tipo === 'receita' ? 'recebido' : 'pago'}</span><input id="p-valor" name="valor" inputmode="decimal" value="${fv(base.valor)}" autofocus></label>
    <label class="fld"><span>Data</span><input id="p-data" name="data" type="date" value="${base.data}"></label>
    <p class="hint">Conta de luz veio diferente? Ajuste o valor. O cadastro da conta fixa não muda.</p>
    <div class="form-actions"><button class="btn pri" type="submit">Confirmar</button></div></form>`);
};
F.pagar = async f => {
  const d = Object.fromEntries(new FormData(f)); const m = d.m || S.mes;
  const ref = d.kind === 'fixo' ? S.fixos.find(x => x.id === d.id) : S.emps.find(x => x.id === d.id);
  const v = parseValor(d.valor); if (!(v > 0)) return toast('Informe o valor.');
  try { await criarLanc(lancDePendente(d.kind, ref, m, v, d.data)); toast('Registrado'); closeSheet(); } catch (_) {}
};
A.pagarTodos = async el => {
  const pend = pendentesMes(S.mes); el.disabled = true;
  try { for (const p of pend) await criarLanc(lancDePendente(p.kind, p.ref, S.mes)); toast(`${pend.length} contas marcadas`); } catch (_) { el.disabled = false; }
};
A.desfazer = async el => { try { await del(COLS.lanc, el.dataset.id); toast('Desfeito'); } catch (_) {} };

    <label class="fld"><span>Descrição</span><input id="fx-desc" name="desc" value="${esc(f.desc || '')}" placeholder="${tipo === 'receita' ? 'Salário' : 'Aluguel, Internet, Netflix…'}" required autofocus></label>
    <div class="f2"><label class="fld big"><span>Valor ${tipo === 'receita' ? '' : '(médio)'}</span><input id="fx-valor" name="valor" inputmode="decimal" value="${fv(f.valor)}" required></label>
    <label class="fld"><span>Dia ${tipo === 'receita' ? 'que cai' : 'do vencimento'}</span><input id="fx-dia" name="dia" type="number" min="1" max="31" value="${f.dia || 5}"></label></div>
    <div class="f2"><label class="fld"><span>Categoria</span><select id="fx-cat" name="cat">${catOpts(tipo, f.cat || (tipo === 'receita' ? 'Salário' : ''))}</select></label>

A.editFixo = (el, e) => { if (e.target.closest('button')) return; const f = S.fixos.find(x => x.id === el.dataset.id); if (f) formFixo(f); };
F.fixo = async fm => {
  const d = Object.fromEntries(new FormData(fm)); const v = parseValor(d.valor); if (!(v > 0)) return toast('Informe o valor.');
  const o = {tipo:d.tipo, desc:d.desc.trim(), valor:r2(v), dia:clamp(+d.dia || 1, 1, 31), cat:d.cat, meio:d.meio.startsWith('cc:') ? 'credito' : d.meio, inicio:d.inicio || ymNow(), ativo:true};
  if (d.meio.startsWith('cc:')) o.cartaoId = d.meio.slice(3);
  if (d.fim) o.fim = d.fim;
  const old = d.id ? S.fixos.find(x => x.id === d.id) : null; if (old?.exemplo) o.exemplo = true;
  try { await put(COLS.fixos, d.id || null, o); toast('Conta fixa salva'); closeSheet(); } catch (_) {}
};
A.delFixo = async el => { if (el.dataset.ok !== '1') { el.dataset.ok = '1'; el.textContent = 'Toque de novo para excluir'; return; } try { await del(COLS.fixos, el.dataset.id); toast('Conta fixa excluída. Os pagamentos já lançados continuam no extrato.'); closeSheet(); } catch (_) {} };

    ${o.id ? `<label class="chk"><input id="o-conc" type="checkbox" name="concluido" ${o.status === 'concluido' ? 'checked' : ''}> Objetivo concluído</label>` : ''}
    <div class="form-actions"><button class="btn pri" type="submit">Salvar</button>${o.id ? `<button class="btn dang" type="button" data-a="delObj" data-id="${o.id}">Excluir</button>` : ''}</div></form>`, sh => {

  <label class="fld"><span>Dados</span><textarea id="imp-t" name="t" rows="8" placeholder="05/11/2026;Mercado;230,50;Mercado&#10;06/11/2026;Uber;18,90"></textarea></label><p class="hint" id="imp-prev"></p>
  <div class="form-actions"><button class="btn pri" type="submit">Importar</button></div></form>`, sh => { $('#imp-t', sh).addEventListener('input', e => { const r = parseImport(e.target.value); $('#imp-prev', sh).textContent = r.length ? `${r.length} lançamentos reconhecidos · ${brl(sum(r.filter(x => x.tipo === 'despesa')))} em despesas · ${brl(sum(r.filter(x => x.tipo === 'receita')))} em receitas` : ''; }); });
function parseImport(txt) {
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean); if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : lines[0].includes(';') ? ';' : ',';
  const split = l => l.split(sep).map(s => s.trim().replace(/^"|"$/g, ''));
  let idx = {data:0, desc:1, valor:2, cat:3, tipo:-1};
  const h = split(lines[0]).map(norm);
  if (h.some(x => /data|descri|valor/.test(x))) {
    idx = {data:h.findIndex(x => /data/.test(x)), desc:h.findIndex(x => /descri|historico|item|nome/.test(x)), valor:h.findIndex(x => /valor|quantia|preco/.test(x)), cat:h.findIndex(x => /categ/.test(x)), tipo:h.findIndex(x => /^tipo/.test(x))};
    lines.shift();
  }
  const neg = lines.some(l => /^-/.test((split(l)[idx.valor] || '').replace(/[R$\s]/g, '')));
  const out = [];
  lines.forEach(l => {
    const c = split(l); let v = parseValor(c[idx.valor]); if (!v || isNaN(v)) return;
    let d = c[idx.data] || ''; let m;
    if ((m = d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) d = `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`;
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    let tipo = 'despesa';
    if (idx.tipo >= 0) tipo = /rec|entr|cred/.test(norm(c[idx.tipo])) ? 'receita' : 'despesa'; else if (neg) tipo = v < 0 ? 'despesa' : 'receita';
    v = Math.abs(v);
    const desc = (c[idx.desc] || '').trim() || 'Importado';
    const lista = tipo === 'receita' ? catsRec() : catsDesp();
    const catIn = idx.cat >= 0 ? lista.find(x => norm(x.n) === norm(c[idx.cat])) : null;
    out.push({tipo, valor:v, desc, data:d, cat:catIn ? catIn.n : (autoCat(desc, tipo) || (tipo === 'receita' ? 'Outras receitas' : 'Outros')), meio:'pix'});
  });
  return out;
}
F.importar = async fm => { const r = parseImport(fm.t.value); if (!r.length) return toast('Não reconheci nenhuma linha. Confira o formato.'); const b = fm.querySelector('[type=submit]'); b.disabled = true;
  try { let i = 0; for (const o of r) { await criarLanc(o); i++; if (i % 10 === 0) b.textContent = `Importando ${i}/${r.length}…`; } toast(`${r.length} lançamentos importados`); closeSheet(); } catch (_) { b.disabled = false; } };

A.aiDicas = async () => {
  if (!S.sample) { toast('A análise com o Claude não está disponível nesta tela.'); return; }
  const m = S.mes, r = resumo(m), med = mediaCat(m);
  const cats = Object.entries(r.porCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `- ${c}: ${brl(v)} (média ${brl(med.media[c] || 0)})`).join('\n');
  const fixos = fixosAtivos(m).filter(f => f.tipo !== 'receita').map(f => `- ${f.desc} (${f.cat}): ${brl(f.valor)}`).join('\n');
  const parc = sum(S.lanc.filter(l => l.mes === m && l.grupo));
  const prompt = `Você é um planejador financeiro pessoal no Brasil, direto e prático. Analise o mês de ${ymLong(m)} de uma pessoa que está no limite do orçamento (não está endividada, mas sobra pouco) e quer gastar menos e guardar mais.
Receitas: ${brl(r.rec + r.pendR)} | Despesas lançadas: ${brl(r.desp)} | Contas ainda a pagar: ${brl(r.pendD)} | Guardado no mês: ${brl(r.guard)} | Meta de poupança: ${metaPoup()}%
Parcelas de cartão no mês: ${brl(parc)}
Despesas por categoria (com média dos meses anteriores):
${cats || '(sem despesas)'}
Contas fixas cadastradas:
${fixos || '(nenhuma)'}
Escreva em português do Brasil, em texto simples sem markdown, de 4 a 6 sugestões numeradas, curtas e concretas, com valores em reais estimados de economia por mês. Comece pelo que mais pesa. Termine com uma frase de qual deve ser o foco do próximo mês.`;
  S.aiBusy = true; S.aiText = ''; render();
  try {
    await S.sample(prompt, {cache:false, onText:({text}) => { S.aiText = text; const o = $('#ai-out'); if (o) { o.hidden = false; o.textContent = text; } }});
  } catch (e) {
    if (e?.code === 'rate_limited') toast('Muitas consultas agora. Tente daqui a pouco.');
    else if (['not_granted', 'sampling_disabled', 'not_declared'].includes(e?.code)) { S.sample = null; toast('Sem permissão para usar o Claude nesta página.'); }
    else toast('A análise não terminou. Tente de novo.');
    if (e?.text) S.aiText = e.text;
  }
  S.aiBusy = false; render();
};

/* ================= inicialização ================= */
let _ids = '';
async function atualizarNomes() {
  if (!S.user) return;
  const ids = [...new Set(S.lanc.map(l => l.por).filter(Boolean))].sort(); const key = ids.join(',');
  if (!ids.length || key === _ids) return; _ids = key;
  try { const ps = await S.user.profiles(ids.slice(0, 64)); const out = {}; ids.forEach(id => { out[id] = ps?.[id]?.name || ''; }); S.nomes = out; render(); } catch (_) {}
}
function setSync(state, txt) { const d = $('#syncdot'); d.className = 'dot ' + state; $('#synctx').textContent = txt; }
async function init() {
  route();
  if (!window.claude || typeof window.claude.use !== 'function') { S.failed = true; setSync('err', 'Offline'); render(); return; }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db) { S.failed = true; setSync('err', 'Sem acesso aos dados'); render(); return; }
  if (user) { S.user = user; try { S.uid = await user.id(); } catch (_) {} try { const own = await user.isOwner(); if (own === false) { const w = await user.can('data.write'); if (w === false) S.blocked = true; } } catch (_) {} }
  S.db = db; render();
  const timer = setTimeout(() => setSync('wait', 'Sem resposta do servidor ainda'), 10000);
  let first = 0; const total = Object.keys(COLS).length + 1;
  const done = (k, snap) => { if (!S.loaded[k] && !snap.metadata.fromCache) { S.loaded[k] = true; first++; if (first >= total) { clearTimeout(timer); setSync('ok', 'Sincronizado'); } } };
  Object.entries(COLS).forEach(([k, col]) => {
    db.collection(col).onSnapshot(snap => { S[k] = snap.docs.map(d => ({id:d.id, ...d.data()})); if (k === 'lanc') { _learn = null; atualizarNomes(); } done(k, snap); render(); },
      e => { console.error(col, e); setSync('err', 'Erro ao sincronizar'); });
  });
  db.doc('config/geral').onSnapshot(snap => { S.cfg = snap.exists ? {...snap.data()} : {}; done('cfg', snap); render(); }, e => console.error('cfg', e));
  claude.use('sample').then(s => { S.sample = s; });
  claude.use('downloads').then(d => { S.dl = d; });
}
init();
})();
