<title>Bolso em Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: app de finanças pessoais — barra lateral no notebook, barra inferior + botão "+" no celular; cartões por função, números tabulares. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#101A2C; --muted:#586477; --line:#D9DFE8;
  --accent:#1D4ED0; --accent-soft:#E2E9FB; --on-accent:#FFFFFF;
  --pos:#08865A; --pos-soft:#DCF2E8; --neg:#C33B2B; --neg-soft:#FAE3DF; --warn:#A86B12; --warn-soft:#FAEFD9;
  --g-ess:#1D4ED0; --g-est:#D27A22; --g-fin:#B03558; --g-fut:#0D8C82;
  --shadow:0 1px 2px rgba(16,26,44,.05),0 6px 20px rgba(16,26,44,.05);
  --f-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111E; --surface:#111A2A; --surface-2:#192439; --ink:#E6EBF3; --muted:#93A0B4; --line:#25324A;
  --accent:#7196FF; --accent-soft:#1A2850; --on-accent:#0A111E;
  --pos:#3FCB8F; --pos-soft:#0F3527; --neg:#FF7B69; --neg-soft:#3D1B17; --warn:#EFB351; --warn-soft:#382A10;
  --g-ess:#7196FF; --g-est:#EF9F4C; --g-fin:#E46E8F; --g-fut:#36C3B6;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A111E; --surface:#111A2A; --surface-2:#192439; --ink:#E6EBF3; --muted:#93A0B4; --line:#25324A;
  --accent:#7196FF; --accent-soft:#1A2850; --on-accent:#0A111E;
  --pos:#3FCB8F; --pos-soft:#0F3527; --neg:#FF7B69; --neg-soft:#3D1B17; --warn:#EFB351; --warn-soft:#382A10;
  --g-ess:#7196FF; --g-est:#EF9F4C; --g-fin:#E46E8F; --g-fut:#36C3B6;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:1.6rem}
h2{font-size:1.05rem}
h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warnc{color:var(--warn)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:none}
main{min-width:0;padding-block:18px 120px;max-width:1180px;width:100%;margin-inline:auto}
@media (min-width:920px){
  .app{grid-template-columns:220px minmax(0,1fr);gap:28px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding-block:22px;overflow:auto}
  main{padding-block:26px 60px}
  .tabbar,.fab{display:none!important}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem}
.brand b{font-family:var(--f-display);font-size:1.05rem}
.nav-a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav-a svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav-a:hover{background:var(--surface-2)}
.nav-a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-a[aria-current="page"] svg{color:var(--accent)}
.nav-a.sec{font-size:.88rem;padding:7px 10px;color:var(--muted)}
.nav-sep{height:1px;background:var(--line);margin:10px 10px}
.side .btn{margin:6px 10px 10px}
.sync{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--pos)} .dot.wait{background:var(--warn)} .dot.err{background:var(--neg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer}
.tabbar svg{width:22px;height:22px}
.tabbar [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px rgba(29,78,208,.35);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}

/* ---------- page header ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.ph h1{margin-top:2px}
.mesnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.mesnav-l{min-width:136px;text-align:center;font-weight:600;font-family:var(--f-display);font-size:.95rem}
.ib{width:34px;height:34px;border-radius:9px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;font-size:1.1rem;color:var(--ink)}
.ib:hover{background:var(--surface-2)}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:6px 8px;border-radius:8px}
.lnk:hover{background:var(--accent-soft)}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr}
@media (min-width:1080px){.g2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{font-size:.82rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:clamp(1rem,4.3vw,1.35rem);font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dang{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.pend{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--neg-soft);color:var(--neg)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:.9rem}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.9rem}
.banner b{color:var(--warn)}
.card.alerta{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn-soft) 55%,var(--surface))}
.badge{position:absolute;top:0;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--neg);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center}
.tabbar a{position:relative}

/* quick add */
.quick{display:flex;gap:8px;margin-bottom:6px}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem}
.quick input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.qprev{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;margin-bottom:16px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.bar-row .n{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.bar-row .meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted)}
.track{grid-column:1/-1;position:relative;height:8px;border-radius:99px;background:var(--surface-2)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.limit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack > span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:.8rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* big available */
.avail .big{font-family:var(--f-display);font-size:2.1rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.avail .split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:14px;font-size:.84rem}
@media (max-width:520px){.avail .split{grid-template-columns:1fr}}
.avail .split div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:8px}

/* hero */
.hero{border-radius:18px;padding:20px;margin-bottom:16px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;opacity:.13;pointer-events:none;background:var(--pos)}
.hero.s-pend::before{background:var(--warn)} .hero.s-bad::before{background:var(--neg)}
.hero > *{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-st{font-size:1.7rem;display:flex;align-items:center;gap:10px;margin-top:2px}
.hero-st i{width:14px;height:14px;border-radius:50%;background:var(--pos);flex:none}
.s-pend .hero-st i{background:var(--warn)} .s-bad .hero-st i{background:var(--neg)}
.hero3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.hero3 > div{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hero3 span{font-size:.75rem;color:var(--muted);font-weight:600}
.hero3 b{font-family:var(--f-display);font-size:clamp(1.05rem,4.4vw,1.3rem);font-weight:600;white-space:nowrap}
.hero3 small{font-size:.74rem;color:var(--muted)}
.hero3 .lnk{padding:0;align-self:flex-start}
.hero-flow{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:.86rem;color:var(--muted)}
.hero-flow b{color:var(--ink)} .hero-flow b.pos{color:var(--pos)} .hero-flow b.neg{color:var(--neg)}
@media (max-width:560px){.hero3{grid-template-columns:1fr 1fr}.hero3 > div:last-child{grid-column:1/-1}.hero-st{font-size:1.4rem}}
.al{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.al:first-child{border-top:0}
.al > i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}
.al-bad > i{background:var(--neg)} .al-warn > i{background:var(--warn)} .al-good > i{background:var(--pos)}
.al .tx{flex:1;min-width:0}
.ano{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (min-width:900px){.ano{grid-template-columns:repeat(12,minmax(0,1fr))}}
.mes-chip{border:1px solid var(--line);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;background:var(--surface);font-size:.74rem;color:var(--muted);min-width:0}
.mes-chip b{font-size:.76rem;color:var(--ink);line-height:1.15;text-align:center}
.mes-chip.c-ok{background:var(--pos-soft);border-color:transparent} .mes-chip.c-ok b{color:var(--pos)}
.mes-chip.c-pend{background:var(--warn-soft);border-color:transparent} .mes-chip.c-pend b{color:var(--warn)}
.mes-chip.c-bad{background:var(--neg-soft);border-color:transparent} .mes-chip.c-bad b{color:var(--neg)}
.mes-chip.sel{outline:2px solid var(--accent);outline-offset:1px}
details.more{margin-top:18px}
details.more > summary{cursor:pointer;font-weight:600;color:var(--accent);padding:12px 14px;border:1px dashed var(--line);border-radius:12px;list-style:none;text-align:center}
details.more > summary::-webkit-details-marker{display:none}
button.bar-row{background:none;border:0;text-align:left;width:100%;padding:6px 6px;margin:-6px -6px;border-radius:10px;cursor:pointer;color:inherit;font:inherit;width:calc(100% + 12px)}
button.bar-row:hover{background:var(--surface-2)}
.chev{color:var(--muted);font-weight:400}

.bolsos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.bolso{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.imp-list{display:flex;flex-direction:column;margin-top:8px}
.imp-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.imp-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.imp-row .tx{min-width:0}.imp-row .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.imp-row .t2{font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.imp-row .am{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.imp-row select{grid-column:2/-1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:.8rem;min-width:0}
.imp-row.off{opacity:.5}
.item-row{grid-template-columns:minmax(0,1fr) 110px 34px}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:.78rem;font-weight:700;flex:none;font-family:var(--f-display)}
.li .tx{flex:1;min-width:0}
.li .t1,.li .t2{display:block}
.li .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .am{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.dayh{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 4px 4px}

.insights{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.insights li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent)}
.insights li.warn::before{background:var(--warn)}
.insights li.good::before{background:var(--pos)}
.ai-out{white-space:pre-wrap;font-size:.9rem;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-top:12px}

.prog{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog > span{display:block;height:100%;background:var(--accent);border-radius:99px}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
tr.tot td{font-weight:700;border-bottom:0}

.cards3{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0}
.filters input{flex:1 1 200px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button,.seg label{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg [aria-pressed="true"],.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg label{padding:0}.seg label span{display:block;padding:6px 14px;border-radius:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}

svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:50}
.sh-back{position:absolute;inset:0;background:rgba(6,10,20,.45)}
.sh-panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:720px){.sh-panel{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:88vh;border-radius:18px;padding:0 22px 22px}}
.sh-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;z-index:1}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:.8rem;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0;width:100%}

<script>
(() => {
'use strict';
/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fBRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const fBRL0 = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const brl = v => fBRL.format(+v || 0);
const brl0 = v => fBRL0.format(+v || 0);

const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => isoDate(new Date());
const ymNow = () => hoje().slice(0, 7);
const addM = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const monthsBetween = (a, b) => { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };

const MESL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${MES[m-1]}/${y.slice(2)}`; };
const ymLong = ym => { const [y, m] = ym.split('-'); return `${MESL[m-1]} ${y}`; };
const diasNoMes = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dLabel = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${MES[m-1]}`; };
const sum = (a, f = x => x.valor) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const r2 = v => Math.round(v * 100) / 100;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clean = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 10);
function parseValor(s) {
  s = String(s ?? '').replace(/[^\d,.\-]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}

/* ================= categorias padrão ================= */
const CATS_DESP = [
  {n:'Moradia', g:'essencial', k:'aluguel,condominio,iptu,reforma,manutencao,diarista,faxina,seguro residencial'},

  {n:'Lazer', g:'estilo', k:'cinema,show,festa,jogo,ingresso,teatro,passeio,parque,steam,playstation,xbox,futebol,clube,regatas,praia,barraca,boliche,estrela santista'},
  {n:'Assinaturas', g:'estilo', k:'streaming,streamer,disney+,star+,netflix,spotify,prime video,amazon prime,disney,hbo,max,globoplay,youtube,icloud,google one,chatgpt,claude,deezer,apple,assinatura,paramount,crunchyroll'},
  {n:'Compras', g:'estilo', k:'shopee,amazon,mercado livre,shein,magalu,magazine,roupa,tenis,loja,renner,riachuelo,c&a,cea,zara,americanas,eletronico,aliexpress,temu,camisa,calca'},
  {n:'Cuidados pessoais', g:'estilo', k:'academia,smartfit,smart fit,barbearia,barbeiro,cabelo,salao,manicure,cosmetico,perfume,boticario,natura,skincare,depilacao'},
  {n:'Pets', g:'estilo', k:'pet,petz,cobasi,racao,veterinario,banho e tosa'},
  {n:'Presentes & doações', g:'estilo', k:'presente,doacao,dizimo,oferta,aniversario,vaquinha,caridade'},
  {n:'Viagens', g:'estilo', k:'passagem,hotel,airbnb,hospedagem,booking,latam,gol,azul,viagem,pousada,decolar'},
  {n:'Dívidas & juros', g:'financeiro', k:'juros,multa,tarifa,anuidade,iof,emprestimo,financiamento,acordo,cheque especial,rotativo'},
  {n:'Impostos & taxas', g:'financeiro', k:'imposto,irpf,darf,das,mei,taxa,cartorio,detran,licenciamento'},
  {n:'Outros', g:'estilo', k:''},
];
const CATS_REC = [
  {n:'Salário', k:'salario,holerite,pagamento empresa'},
  {n:'Vale alimentação', k:'va,vale alimentacao,alelo alimentacao,sodexo alimentacao,pluxee alimentacao,caju,flash'},
  {n:'Vale refeição', k:'vr,vale refeicao,ticket restaurante,alelo refeicao,sodexo refeicao,pluxee refeicao'},
  {n:'PLR / PRD / Abono', k:'bonus,plr,prd,participacao,abono,vra'},
  {n:'13º / Férias', k:'13,decimo,ferias'},
  {n:'Renda extra', k:'freela,freelance,extra,bico,servico,venda,vendi,diaria,diarias,ajuda de custo'},
  {n:'Rendimentos', k:'rendimento,dividendo,dividendos,juros recebidos'},
  {n:'Reembolso', k:'reembolso,estorno,devolucao,pix de volta'},
  {n:'Outras receitas', k:''},
];
const GRUPOS = {
  essencial: {n:'Essenciais', ideal:.5, c:'var(--g-ess)', d:'moradia, contas, mercado, transporte, saúde, educação'},
  estilo: {n:'Estilo de vida', ideal:.3, c:'var(--g-est)', d:'comer fora, lazer, compras, assinaturas'},
  financeiro: {n:'Dívidas e taxas', ideal:0, c:'var(--g-fin)', d:'juros, tarifas, impostos'},
};
const MEIOS = {pix:'Pix', debito:'Débito', va:'Vale alimentação', vr:'Vale refeição', dinheiro:'Dinheiro', boleto:'Boleto', transferencia:'Transferência'};
const EXTRAS = ['PLR / PRD / Abono', '13º / Férias', 'Renda extra'];
const isVA = l => !!l && (l.meio === 'va' || l.meio === 'vr');
const walletRec = l => l.meio === 'va' || l.cat === 'Vale alimentação' ? 'va' : l.meio === 'vr' || l.cat === 'Vale refeição' ? 'vr' : 'conta';
const isVARec = l => l.tipo === 'receita' && walletRec(l) !== 'conta';
const INV_TIPOS = ['Reserva de emergência','Conta remunerada','Poupança','CDB / Renda fixa','Tesouro Direto','Ações / FIIs','Fundos','Previdência','Cripto','Outro'];
const OBJ_TIPOS = {
  viagem: {n:'Viagem', itens:['Passagens','Hospedagem','Alimentação','Transporte local','Passeios e ingressos','Compras','Seguro viagem','Documentos / visto','Câmbio e IOF','Imprevistos']},
  compra: {n:'Compra grande', itens:['Produto','Frete / instalação','Acessórios','Garantia estendida']},
  evento: {n:'Evento / festa', itens:['Local','Comida e bebida','Decoração','Roupa','Fotografia','Convites','Imprevistos']},
  casa: {n:'Casa / mudança', itens:['Mobília','Eletrodomésticos','Reforma','Mudança','Decoração']},
  carro: {n:'Carro / moto', itens:['Entrada','Documentação','Seguro','IPVA','Acessórios']},
  estudo: {n:'Estudos', itens:['Mensalidade / curso','Material','Inscrição / prova','Transporte']},
  reserva: {n:'Reserva / meta de dinheiro', itens:['Valor a juntar']},
  outro: {n:'Outro', itens:['Geral']},
};

/* ================= estado ================= */
const S = {
  lanc: [], fixos: [], cartoes: [], emps: [], inv: [], objs: [], cfg: {},
  loaded: {}, mes: ymNow(), ano: +ymNow().slice(0, 4), view: 'inicio',
  db: null, sample: null, dl: null, canWrite: true,
  filtro: {q: '', tipo: '', cat: ''}, aiText: '', aiBusy: false,
  uid: null, user: null, nomes: {}, chat: [], chatBusy: false, projMes: null,
};
const A = {}, F = {};
const COLS = {lanc:'lanc', fixos:'fixos', cartoes:'cartoes', emps:'emprestimos', inv:'investimentos', objs:'objetivos'};
const catsDesp = () => (Array.isArray(S.cfg.cats) && S.cfg.cats.length ? S.cfg.cats : CATS_DESP);
const catsRec = () => (Array.isArray(S.cfg.rcats) && S.cfg.rcats.length ? S.cfg.rcats : CATS_REC);
const grupoDe = cat => (catsDesp().find(c => c.n === cat) || {}).g || 'estilo';
const orcDoMes = m => { const base = {...(S.cfg.orc || {})}, mm = ((S.cfg.orcMes || {})[m]) || {}; Object.entries(mm).forEach(([c, v]) => { if (v === null || v === undefined) return; if (+v > 0) base[c] = +v; else base[c] = 0; }); Object.keys(base).forEach(c => { if (!(+base[c] > 0)) Reflect.deleteProperty(base, c); }); return base; };
const metaPoup = () => (S.cfg.metaPoup ?? 20);
const cartao = id => S.cartoes.find(c => c.id === id);
const isFixo = l => !!(l.fixoId || l.empId || l.fixo);
const temExemplos = () => [S.lanc, S.fixos, S.cartoes, S.emps, S.inv, S.objs].some(a => a.some(x => x.exemplo));

/* ================= persistência ================= */
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, ms);
}
function dbErr(e) {
  console.error(e);
  const c = e && e.code;
  if (c === 'invalid_argument') { S.canWrite = false; toast('Sem permissão para salvar aqui. Abra o controle logado na sua conta.'); }
  else if (c === 'quota_exceeded') toast('Limite de armazenamento atingido. Exporte um backup e apague lançamentos antigos.');
  else toast('Não consegui salvar agora. Verifique a conexão e tente de novo.');
}
async function put(col, id, data) {
  if (!S.db) { toast('Ainda conectando aos seus dados…'); throw new Error('no db'); }
  const ref = id ? S.db.doc(`${col}/${id}`) : S.db.collection(col).doc();
  try { await ref.set(clean(data)); return ref.id; } catch (e) { dbErr(e); throw e; }
}
async function del(col, id) {
  try { await S.db.doc(`${col}/${id}`).delete(); } catch (e) { dbErr(e); throw e; }
}
const strip = o => { const {id, ...rest} = o; return rest; };
async function saveCfg(patch) { S.cfg = {...S.cfg, ...patch}; await put('config', 'geral', S.cfg); }

/* ================= regras de negócio ================= */
// mês da fatura em que a compra no crédito cai (mês do vencimento)
function mesFatura(data, c) {
  const [y, m, d] = data.split('-').map(Number);
  const ym = `${y}-${pad(m)}`;
  const F = +c?.fecha || 1, V = +c?.vence || 10;
  const fech = d >= F ? addM(ym, 1) : ym;
  return V > F ? fech : addM(fech, 1);
}
const ajusteFixo = (f, m) => (f.ajustes && f.ajustes[m]) || null;
const valorFixo = (f, m) => { const a = ajusteFixo(f, m); return a && a.v != null ? +a.v : +f.valor || 0; };
const diaFixo = (f, m) => { const a = ajusteFixo(f, m); return clamp(a && a.dia ? +a.dia : +f.dia || 1, 1, diasNoMes(m)); };
const fixosAtivos = m => S.fixos.filter(f => f.ativo !== false && (!f.inicio || f.inicio <= m) && (!f.fim || f.fim >= m) && !ajusteFixo(f, m)?.pular);
const empsAtivos = m => S.emps.filter(e => !e.quitado && e.inicio && e.inicio <= m && addM(e.inicio, (+e.n || 1) - 1) >= m);
const pagoFixo = (f, m) => S.lanc.find(l => l.fixoId === f.id && (l.refMes || l.mes) === m);
const pagoEmpL = (e, m) => S.lanc.find(l => l.empId === e.id && l.mes === m);
const parcNum = (e, m) => monthsBetween(e.inicio, m) + 1;
const empPagoNoMes = (e, m) => !!pagoEmpL(e, m) || parcNum(e, m) <= (+e.pagasAntes || 0);
function empPagas(e) {
  let n = 0; const N = +e.n || 0;
  for (let i = 0; i < N; i++) if (empPagoNoMes(e, addM(e.inicio, i))) n++;
  return n;
}
function pendentesMes(m) {
  const out = [];
  fixosAtivos(m).forEach(f => { if (!pagoFixo(f, m)) out.push({kind:'fixo', ref:f, tipo:f.tipo || 'despesa', valor:valorFixo(f, m), desc:f.desc, dia:diaFixo(f, m), cat:f.cat}); });
  empsAtivos(m).forEach(e => { if (!empPagoNoMes(e, m)) out.push({kind:'emp', ref:e, tipo:e.direcao === 'receber' ? 'receita' : 'despesa', valor:+e.parcela || 0, desc:e.desc, dia:+e.dia || 1, cat:e.cat || 'Dívidas & juros'}); });
  return out.sort((a, b) => a.dia - b.dia);
}
const fatKey = (c, m) => `${c.id}_${m}`;
const faturaPaga = (c, m) => !!(S.cfg.faturasPagas || {})[fatKey(c, m)];
const dataFixo = (f, m) => `${m}-${pad(diaFixo(f, m))}`;
function fixosNaFatura(c, fm) { let t = 0; [addM(fm, -1), fm].forEach(mm => fixosAtivos(mm).forEach(f => { if (f.cartaoId === c.id && f.tipo !== 'receita' && !pagoFixo(f, mm) && mesFatura(dataFixo(f, mm), c) === fm) t += valorFixo(f, mm); })); return t; }
const valorFatura = (c, m) => sum(S.lanc.filter(l => l.cartaoId === c.id && l.mes === m && l.tipo !== 'receita')) + fixosNaFatura(c, m);
const vencFatura = (c, m) => `${m}-${pad(clamp(+c.vence || 10, 1, diasNoMes(m)))}`;
const saldoInv = i => sum(i.movs || [], mv => (mv.t === 'resgate' ? -1 : 1) * (+mv.v || 0));
const objGuardado = o => sum(o.movs || [], mv => +mv.v || 0);
const objPrevisto = o => sum(o.itens || [], it => +it.prev || 0);
function guardadoMes(m) {
  let g = 0;
  S.inv.forEach(i => (i.movs || []).forEach(mv => { if ((mv.d || '').slice(0, 7) === m) { if (mv.t === 'aporte') g += +mv.v || 0; if (mv.t === 'resgate') g -= +mv.v || 0; } }));
  S.objs.forEach(o => (o.movs || []).forEach(mv => { if ((mv.d || '').slice(0, 7) === m) g += +mv.v || 0; }));
  return g;
}
function resumo(m) {
  const L = S.lanc.filter(l => l.mes === m);
  const D = L.filter(l => l.tipo !== 'receita'), R = L.filter(l => l.tipo === 'receita');
  const desp = sum(D), rec = sum(R);
  const fixoD = sum(D.filter(isFixo));
  const parcD = sum(D.filter(l => (+l.nparc || 1) > 1 && !isFixo(l)));
  const pend = pendentesMes(m);
  const porCat = {}; D.forEach(l => { porCat[l.cat || 'Outros'] = (porCat[l.cat || 'Outros'] || 0) + (+l.valor || 0); });
  const porCatVar = {}; D.filter(l => !isFixo(l)).forEach(l => { porCatVar[l.cat || 'Outros'] = (porCatVar[l.cat || 'Outros'] || 0) + (+l.valor || 0); });
  const porGrupo = {essencial:0, estilo:0, financeiro:0};
  Object.entries(porCat).forEach(([c, v]) => { porGrupo[grupoDe(c)] = (porGrupo[grupoDe(c)] || 0) + v; });
  const vaRec = sum(R.filter(isVARec)) + sum(pend.filter(p => p.tipo === 'receita' && walletRec({cat:p.cat, meio:p.ref.meio}) !== 'conta'));
  const vaDesp = sum(D.filter(isVA)) + sum(pend.filter(p => p.tipo === 'despesa' && isVA(p.ref)));
  const extras = sum(R.filter(l => EXTRAS.includes(l.cat)));
  return {m, L, D, R, desp, rec, fixoD, parcD, varD: desp - fixoD - parcD, pend,
    pendD: sum(pend.filter(p => p.tipo === 'despesa')), pendR: sum(pend.filter(p => p.tipo === 'receita')),
    guard: guardadoMes(m), porCat, porCatVar, porGrupo, vaRec, vaDesp, extras};
}
function mediaCat(m, n = 3, soVar = false) {
  const out = {}; const meses = [];
  for (let i = 1; i <= n; i++) meses.push(addM(m, -i));
  const comDados = meses.filter(x => S.lanc.some(l => l.mes === x && l.tipo !== 'receita'));
  if (!comDados.length) return {media:{}, n:0, desp:0};
  comDados.forEach(x => S.lanc.forEach(l => { if (l.mes === x && l.tipo !== 'receita' && (!soVar || !isFixo(l))) out[l.cat || 'Outros'] = (out[l.cat || 'Outros'] || 0) + (+l.valor || 0); }));
  Object.keys(out).forEach(k => out[k] /= comDados.length);
  const desp = comDados.reduce((s, x) => s + sum(S.lanc.filter(l => l.mes === x && l.tipo !== 'receita')), 0) / comDados.length;
  return {media: out, n: comDados.length, desp};
}

/* ---------- categorização automática ---------- */
let _learn = null;
function learned() {

  if (r.meio === 'va' || r.meio === 'vr') t = t.replace(/\b(no |com |do )?(va|vr|vale|refei[cç][aã]o|alimenta[cç][aã]o|alelo|sodexo|pluxee|caju)\b/gi, ' ');

  const totV = sum(varCats, c => +orc[c] || 0), gastoV = sum(varCats, c => r.porCatVar[c] || 0);
  const extrasR = sum(r.R.filter(l => EXTRAS.includes(l.cat) && !l.fixoId));
  const sobra = totR + extrasR - totD - totV;
  let h = header('Minhas contas', 'O plano do mês: o que entra e o que sai') + exBanner();
  h += `<p class="muted small" style="margin:-6px 0 14px">Contas no crédito (ex.: streaming no Nubank) entram <b>sozinhas</b> na fatura no dia da cobrança. Toque em <b>Editar</b> para mudar valor, dia ou apagar. Dá para mudar <b>só este mês</b> ou <b>todos os meses</b>. Use as setas do mês para planejar os próximos.</p>`;
  h += `<section class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>Plano de ${MESL[+m.slice(5) - 1].toLowerCase()}</h2><p>Renda prevista menos contas fixas e limites do dia a dia</p></div><span class="pill ${sobra < 0 ? 'bad' : 'ok'}">${sobra < 0 ? 'Plano no vermelho' : 'Plano fecha'}</span></div>
    <div class="split" style="display:grid;grid-template-columns:1fr;gap:6px;font-size:.9rem">
      <div class="row" style="justify-content:space-between"><span>Renda fixa${extrasR ? ' + extras' : ''}</span><b class="num pos">${brl(totR + extrasR)}</b></div>
      <div class="row" style="justify-content:space-between"><span>− Contas fixas e parcelas</span><b class="num">${brl(totD)}</b></div>
      <div class="row" style="justify-content:space-between"><span>− Gastos do dia a dia planejados</span><b class="num">${brl(totV)}</b></div>
      <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:8px"><span><b>Sobra planejada</b></span><b class="num ${sobra < 0 ? 'neg' : 'pos'}">${brl(sobra)}</b></div>
    </div><div style="margin-top:14px">${bolsosHTML(projMes(m))}</div>${totR ? `<p class="hint" style="margin-top:8px">Contas fixas levam ${pct(totD / totR)} da renda fixa (ideal abaixo de 50%).</p>` : ''}</section>`;
  const row = (f, tipo) => {
    const pg = pagoFixo(f, m), aj = ajusteFixo(f, m), v = vf(f);
    return `<div class="li" style="cursor:default"><span class="ic" style="background:${pg ? 'var(--pos-soft)' : 'var(--warn-soft)'};color:${pg ? 'var(--pos)' : 'var(--warn)'}">${pad(diaFixo(f, m))}</span><span class="tx"><span class="t1">${esc(f.desc)}${aj ? ' <span class="pill acc">só este mês</span>' : ''}</span><span class="t2">${pg ? (tipo === 'receita' ? 'recebido' : 'pago') + (+pg.valor !== v ? ` ${brl(pg.valor)}` : '') : 'dia ' + diaFixo(f, m)} · ${esc(f.cat || '')}${f.cartaoId ? ' · ' + esc(cartao(f.cartaoId)?.nome || '') : f.meio ? ' · ' + (MEIOS[f.meio] || '') : ''}</span></span><span class="am ${tipo === 'receita' ? 'pos' : ''}">${brl(v)}</span><button class="lnk small" data-a="editFixo" data-id="${f.id}">Editar</button>${f.cartaoId && tipo !== 'receita' ? (pg ? '<span class="pill ok" title="Lançado na fatura">✓ fatura</span>' : `<span class="pill acc" title="Entra sozinho na fatura no dia ${diaFixo(f, m)}">auto</span>`) : pg ? `<button class="pill ok" style="border:0;cursor:pointer" data-a="desfazer" data-id="${pg.id}" title="Desfazer">✓</button>` : `<button class="btn sm" data-a="pagar" data-kind="fixo" data-id="${f.id}">${tipo === 'receita' ? 'Recebi' : 'Paguei'}</button>`}</div>`;
  };
  const sec = (titulo, arr, tipo, btn) => `<section class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>${titulo}</h2><p class="num">${brl(sum(arr, vf))} no mês</p></div>${btn}</div>${arr.length ? `<div class="list">${arr.sort((a, b) => diaFixo(a, m) - diaFixo(b, m)).map(f => row(f, tipo)).join('')}</div>` : '<div class="empty">Nenhuma cadastrada.</div>'}</section>`;
  h += sec('Renda fixa', recF, 'receita', '<button class="btn sm" data-a="novoFixo" data-tipo="receita">+ Renda</button>');
  h += sec('Contas fixas', despF, 'despesa', `<div class="row">${pendentesMes(m).some(p => p.tipo === 'despesa') ? '<button class="lnk small" data-a="pagarTodos">Marcar todas pagas</button>' : ''}<button class="btn sm pri" data-a="novoFixo">+ Conta</button></div>`);
  // faturas
  if (S.cartoes.length) h += `<section class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>Faturas de cartão</h2><p>Somam as compras lançadas no crédito</p></div><a class="lnk" href="#cartoes">Cartões</a></div><div class="list">${S.cartoes.map(c => { const v = valorFatura(c, m), pg = faturaPaga(c, m); return `<div class="li" style="cursor:default"><span class="ic" style="background:${pg ? 'var(--pos-soft)' : 'var(--warn-soft)'};color:${pg ? 'var(--pos)' : 'var(--warn)'}">${pad(+c.vence || 1)}</span><span class="tx"><span class="t1">Fatura ${esc(c.nome)}</span><span class="t2">${pg ? 'paga' : 'vence dia ' + c.vence}</span></span><span class="am">${brl(v)}</span>${pg ? `<button class="pill ok" style="border:0;cursor:pointer" data-a="desfazerFatura" data-k="${fatKey(c, m)}" title="Desfazer">✓</button>` : v > 0 ? `<button class="btn sm" data-a="pagarFatura" data-id="${c.id}" data-m="${m}">Paguei</button>` : ''}</div>`; }).join('')}</div></section>`;
  // dia a dia
  h += `<section class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>Gastos do dia a dia (variáveis)</h2><p>${Object.keys((S.cfg.orcMes || {})[m] || {}).length ? '<span class="pill acc">plano próprio deste mês</span> ' : ''}Quanto você planeja gastar por categoria. ${brl(gastoV)} de ${brl(totV)} usados.</p></div><button class="btn sm pri" data-a="editLimites" data-m="${m}">Editar valores</button></div>
    ${varCats.length ? `<div class="bars">${varCats.map(c => { const lim = +orc[c] || 0, g = r.porCatVar[c] || 0, over = lim && g > lim; return `<div class="bar-row"><span class="n">${esc(c)}</span><span class="v ${over ? 'neg' : ''}">${brl0(g)} <span class="muted small">/ ${lim ? brl0(lim) : 'sem limite'}</span></span><div class="track"><span class="fill" style="width:${lim ? clamp(g / lim * 100, 0, 100) : 0}%;background:${over ? 'var(--neg)' : 'var(--g-est)'}"></span></div><div class="meta"><span>${lim ? (over ? `passou ${brl(g - lim)}` : `resta ${brl(lim - g)}`) : ''}</span><span></span></div></div>`; }).join('')}</div>` : '<div class="empty">Defina quanto quer gastar com mercado, gasolina, lazer… em Editar valores.</div>'}</section>`;
  if (em.length) h += `<section class="card"><div class="card-h"><h2>Parcelas de empréstimos</h2><a class="lnk" href="#emprestimos">Empréstimos</a></div><div class="list">${em.map(e => {
    const pg = empPagoNoMes(e, m), l = pagoEmpL(e, m), rec = e.direcao === 'receber';
    return `<div class="li" style="cursor:default"><span class="ic" style="background:${pg ? 'var(--pos-soft)' : 'var(--warn-soft)'};color:${pg ? 'var(--pos)' : 'var(--warn)'}">${pad(+e.dia || 1)}</span><span class="tx"><span class="t1">${esc(e.desc)}</span><span class="t2">parcela ${parcNum(e, m)} de ${e.n}${rec ? ' · a receber' : ''}</span></span><span class="am ${rec ? 'pos' : ''}">${brl(e.parcela)}</span>${pg ? (l ? `<button class="pill ok" style="border:0;cursor:pointer" data-a="desfazer" data-id="${l.id}">✓</button>` : '<span class="pill ok">✓ Pago</span>') : `<button class="btn sm" data-a="pagar" data-kind="emp" data-id="${e.id}">${rec ? 'Recebi' : 'Paguei'}</button>`}</div>`;
  }).join('')}</div></section>`;
  return h;
}

/* ---------- CARTÕES ---------- */
function vCartoes() {
  const m = S.mes;
  let h = header('Cartões de crédito', 'Faturas e parcelamentos') + exBanner();
  h += `<div class="row" style="margin-bottom:14px"><button class="btn pri" data-a="novoCartao">+ Novo cartão</button></div>`;
  if (!S.cartoes.length) return h + '<div class="empty">Cadastre seus cartões com dia de fechamento e vencimento. Assim cada compra parcelada cai sozinha na fatura certa.</div>';
  h += '<div class="cards3" style="margin-bottom:16px">';
  S.cartoes.forEach(c => {
    const aberto = mesFatura(hoje(), c);
    const usado = sum(S.lanc.filter(l => l.cartaoId === c.id && l.mes >= aberto && l.tipo !== 'receita'));
    const lim = +c.limite || 0;
    const fat = sum(S.lanc.filter(l => l.cartaoId === c.id && l.mes === m && l.tipo !== 'receita'));
    const prox = Array.from({length:6}, (_, i) => { const mm = addM(m, i); return [mm, sum(S.lanc.filter(l => l.cartaoId === c.id && l.mes === mm && l.tipo !== 'receita'))]; });
    const mx = Math.max(1, ...prox.map(p => p[1]));
    h += `<section class="card"><div class="card-h"><div><h2>${esc(c.nome)}</h2><p>fecha dia ${c.fecha} · vence dia ${c.vence}</p></div><button class="lnk" data-a="editCartao" data-id="${c.id}">Editar</button></div>
      <p class="eyebrow">Fatura de ${ymLabel(m)} ${faturaPaga(c, m) ? '<span class="pill ok">paga</span>' : ''}</p><div style="font-family:var(--f-display);font-size:1.6rem;font-weight:600" class="num">${brl(fat)}</div>
      ${lim ? `<div style="margin:12px 0 4px" class="prog"><span style="width:${clamp(usado / lim * 100, 0, 100)}%;background:${usado / lim > .8 ? 'var(--neg)' : 'var(--accent)'}"></span></div><p class="small muted">Limite comprometido ${brl(usado)} de ${brl(lim)} · livre ${brl(lim - usado)}</p>` : ''}
      <div style="display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:14px" role="img" aria-label="Próximas faturas">${prox.map(([mm, v]) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end"><span class="num" style="font-size:.62rem;color:var(--muted)">${v ? kfmt(v) : ''}</span><span style="width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:${mm === m ? 'var(--accent)' : 'color-mix(in srgb, var(--accent) 35%, var(--surface-2))'};height:${Math.max(2, v / mx * 44)}px"></span><span style="font-size:.66rem;color:var(--muted)">${MES[+mm.slice(5) - 1]}</span></div>`).join('')}</div>
    </section>`;
  });
  h += '</div>';
  // parcelamentos
  const grupos = {};
  S.lanc.filter(l => l.grupo).forEach(l => { (grupos[l.grupo] = grupos[l.grupo] || []).push(l); });
  const ativos = Object.values(grupos).filter(g => g.some(l => l.mes >= ymNow())).map(g => {
    g.sort((a, b) => a.parc - b.parc);
    const f = g[0]; const fim = g[g.length - 1].mes;
    const pagas = g.filter(l => l.mes < ymNow()).length;
    const rest = sum(g.filter(l => l.mes >= ymNow()));
    return {f, fim, pagas, rest, n:f.nparc, vp:f.valor, total:f.total || sum(g)};
  }).sort((a, b) => a.fim.localeCompare(b.fim));
  const totMes = sum(ativos, a => a.vp);
  h += `<section class="card"><div class="card-h"><div><h2>Compras parceladas em andamento</h2><p>${ativos.length} parcelamento${ativos.length === 1 ? '' : 's'} · ${brl(totMes)} por mês · ${brl(sum(ativos, a => a.rest))} ainda a pagar</p></div></div>
    ${ativos.length ? `<div class="tbl-wrap"><table><thead><tr><th>Compra</th><th>Parcela</th><th>Valor/mês</th><th>Falta</th><th>Termina</th></tr></thead><tbody>${ativos.map(a => `<tr><td>${esc(a.f.desc)}<div class="small muted">${esc(cartao(a.f.cartaoId)?.nome || MEIOS[a.f.meio] || '')}</div></td><td>${Math.min(a.pagas + 1, a.n)}/${a.n}</td><td>${brl(a.vp)}</td><td>${brl(a.rest)}</td><td>${ymLabel(a.fim)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nenhuma compra parcelada em aberto.</div>'}
  </section>`;
  return h;
}

/* ---------- EMPRÉSTIMOS ---------- */
function vEmprestimos() {
  let h = header('Empréstimos e dívidas', 'O que você deve e o que te devem', '') + exBanner();
  const devo = S.emps.filter(e => e.direcao !== 'receber'), receber = S.emps.filter(e => e.direcao === 'receber');
  const restante = e => Math.max(0, (+e.n - empPagas(e))) * (+e.parcela || 0);
  h += `<div class="kpis"><div class="kpi"><div class="eyebrow">Você deve</div><div class="v neg">${brl(sum(devo, restante))}</div><div class="s">${devo.filter(e => !e.quitado).length} ativo(s)</div></div>
    <div class="kpi"><div class="eyebrow">Parcelas por mês</div><div class="v">${brl(sum(empsAtivos(ymNow()).filter(e => e.direcao !== 'receber'), e => e.parcela))}</div><div class="s">em ${ymLabel(ymNow())}</div></div>
    <div class="kpi"><div class="eyebrow">Te devem</div><div class="v pos">${brl(sum(receber, restante))}</div><div class="s">${receber.length} pessoa(s)</div></div>
    <div class="kpi"><div class="eyebrow">Juros estimados</div><div class="v">${brl(sum(devo, e => e.original ? Math.max(0, +e.n * +e.parcela - +e.original) : 0))}</div><div class="s">total pago − valor pego</div></div></div>`;
  h += `<div class="row" style="margin-bottom:14px"><button class="btn pri" data-a="novoEmp">+ Novo empréstimo / financiamento</button><button class="btn" data-a="novoEmp" data-dir="receber">+ Alguém me deve</button></div>`;
  const card = e => {
    const pg = empPagas(e), n = +e.n || 1, fim = addM(e.inicio, n - 1);
    return `<section class="card"><div class="card-h"><div><h2>${esc(e.desc)}</h2><p>${esc(e.credor || '')}${e.taxa ? ` · ${e.taxa}% a.m.` : ''}</p></div><button class="lnk" data-a="editEmp" data-id="${e.id}">Editar</button></div>
      <div class="row" style="justify-content:space-between"><div><p class="eyebrow">Falta ${e.direcao === 'receber' ? 'receber' : 'pagar'}</p><div style="font-family:var(--f-display);font-size:1.4rem;font-weight:600" class="num">${brl(restante(e))}</div></div><div style="text-align:right"><p class="eyebrow">Parcela</p><div class="num" style="font-weight:600">${brl(e.parcela)}</div></div></div>
      <div class="prog" style="margin:12px 0 6px"><span style="width:${(pg / n * 100).toFixed(1)}%;background:${e.direcao === 'receber' ? 'var(--pos)' : 'var(--g-fin)'}"></span></div>
      <p class="small muted">${pg} de ${n} parcelas · termina em ${ymLabel(fim)}${e.quitado ? ' · quitado' : ''}</p></section>`;
  };
  if (!S.emps.length) return h + '<div class="empty">Cadastre empréstimos, financiamentos (carro, casa) ou dinheiro que emprestou. As parcelas entram sozinhas nas contas do mês.</div>';
  if (devo.length) h += `<h2 style="margin:6px 0 12px">Você deve</h2><div class="cards3" style="margin-bottom:20px">${devo.map(card).join('')}</div>`;
  if (receber.length) h += `<h2 style="margin:6px 0 12px">Te devem</h2><div class="cards3">${receber.map(card).join('')}</div>`;
  return h;
}

/* ---------- INVESTIMENTOS ---------- */
function vInvest() {
  const ano = ymNow().slice(0, 4);
  const tot = sum(S.inv, saldoInv);
  const movAno = t => sum(S.inv.flatMap(i => (i.movs || []).filter(mv => mv.t === t && (mv.d || '').startsWith(ano))), mv => mv.v);
  const reserva = sum(S.inv.filter(i => i.tipo === 'Reserva de emergência'), saldoInv);
  const custo = mediaCat(addM(ymNow(), 1)).desp || resumo(ymNow()).desp;
  const dividas = sum(S.emps.filter(e => e.direcao !== 'receber'), e => Math.max(0, (+e.n - empPagas(e))) * (+e.parcela || 0)) + sum(S.lanc.filter(l => l.grupo && l.mes > ymNow()));
  const objG = sum(S.objs, objGuardado);
  let h = header('Investimentos e reservas', 'Dinheiro guardado', '') + exBanner();
  h += `<div class="kpis"><div class="kpi"><div class="eyebrow">Total investido</div><div class="v" style="color:var(--g-fut)">${brl(tot)}</div><div class="s">+ ${brl(objG)} separado em objetivos</div></div>
    <div class="kpi"><div class="eyebrow">Aportes em ${ano}</div><div class="v">${brl(movAno('aporte') - movAno('resgate'))}</div><div class="s">líquido de resgates</div></div>
    <div class="kpi"><div class="eyebrow">Rendimentos em ${ano}</div><div class="v pos">${brl(movAno('rendimento'))}</div><div class="s">atualize o saldo todo mês</div></div>
    <div class="kpi"><div class="eyebrow">Patrimônio líquido</div><div class="v">${brl(tot + objG - dividas)}</div><div class="s">investido − dívidas e parcelas futuras</div></div></div>`;
  if (custo > 0) {
    const alvo = custo * 6, s = reserva / alvo;
    h += `<section class="card" style="margin-bottom:16px"><div class="card-h"><div><h2>Reserva de emergência</h2><p>Meta: 6 meses do seu custo de vida (${brl(custo)}/mês)</p></div><span class="pill ${s >= 1 ? 'ok' : 'pend'}">${(reserva / custo).toLocaleString('pt-BR', {maximumFractionDigits:1})} meses</span></div>
      <div class="prog"><span style="width:${clamp(s * 100, 0, 100)}%;background:var(--g-fut)"></span></div><p class="small muted" style="margin-top:6px">${brl(reserva)} de ${brl(alvo)}${s < 1 ? ` · faltam ${brl(alvo - reserva)}` : ' · meta atingida'}</p></section>`;
  }
  h += `<div class="row" style="margin-bottom:14px"><button class="btn pri" data-a="novoInv">+ Nova conta / investimento</button></div>`;
  if (!S.inv.length) return h + '<div class="empty">Cadastre onde seu dinheiro está guardado: reserva, CDB, Tesouro, ações, poupança. Registre aportes e atualize o saldo para ver quanto rendeu.</div>';
  h += `<div class="cards3">${S.inv.map(i => {
    const s = saldoInv(i), meta = +i.meta || 0;
    const ult = [...(i.movs || [])].sort((a, b) => (b.d || '').localeCompare(a.d || '')).slice(0, 3);
    return `<section class="card"><div class="card-h"><div><h2>${esc(i.nome)}</h2><p>${esc(i.tipo || '')}${i.inst ? ' · ' + esc(i.inst) : ''}</p></div><button class="lnk" data-a="editInv" data-id="${i.id}">Editar</button></div>
      <div style="font-family:var(--f-display);font-size:1.5rem;font-weight:600" class="num">${brl(s)}</div>
      ${meta ? `<div class="prog" style="margin:10px 0 4px"><span style="width:${clamp(s / meta * 100, 0, 100)}%;background:var(--g-fut)"></span></div><p class="small muted">${pct(s / meta)} da meta de ${brl0(meta)}</p>` : ''}
      ${ult.length ? `<div class="small muted" style="margin-top:10px;display:flex;flex-direction:column;gap:3px">${ult.map(mv => `<div class="row" style="gap:6px"><span>${dLabel(mv.d)}</span><span>${{aporte:'Aporte', resgate:'Resgate', rendimento:'Rendimento', inicial:'Saldo inicial'}[mv.t] || mv.t}</span><span class="sp"></span><span class="num ${mv.t === 'resgate' ? 'neg' : 'pos'}">${mv.t === 'resgate' ? '−' : '+'} ${brl(mv.v)}</span></div>`).join('')}</div>` : ''}
      <div class="row" style="margin-top:14px"><button class="btn sm" data-a="movInv" data-id="${i.id}" data-t="aporte">Aportar</button><button class="btn sm" data-a="movInv" data-id="${i.id}" data-t="resgate">Resgatar</button><button class="btn sm" data-a="movInv" data-id="${i.id}" data-t="saldo">Atualizar saldo</button></div></section>`;
  }).join('')}</div>`;
  return h;
}

/* ---------- OBJETIVOS ---------- */
function vObjetivos() {
  let h = header('Objetivos', 'Planeje viagens e compras', '') + exBanner();
  h += `<div class="row" style="margin-bottom:14px"><button class="btn pri" data-a="novoObj">+ Novo objetivo</button></div>`;
  if (!S.objs.length) return h + '<div class="empty">Crie um objetivo (ex.: viagem para o Chile em julho), divida o custo por categoria e veja quanto guardar por mês. Gastos ligados ao objetivo aparecem como realizado.</div>';
  const ordem = [...S.objs].sort((a, b) => (a.status === 'concluido') - (b.status === 'concluido') || String(a.alvo || '').localeCompare(String(b.alvo || '')));
  h += `<div class="cards3">${ordem.map(o => {
    const prev = objPrevisto(o), g = objGuardado(o);
    const gastos = S.lanc.filter(l => l.objId === o.id);
    const gasto = sum(gastos);
    const meses = o.alvo ? Math.max(1, monthsBetween(ymNow(), o.alvo)) : null;
    const falta = Math.max(0, prev - g - gasto);

function montarImport(raw, orig, fat) {

    else if (/pagamento (de |da )?fatura|pgto fatura/.test(nd)) ign = 'pagamento de fatura (as compras já contam no cartão)';
    else if (/aplicacao|resgate|rdb|caixinha|cofrinho|guardad/.test(nd)) ign = 'dinheiro guardado ou resgatado';
    const valor = r2(Math.abs(x.valor));
    const meio = cc ? 'credito' : orig === 'va' || orig === 'vr' ? orig : /pix/.test(nd) ? 'pix' : /boleto|pagamento de conta|pag conta/.test(nd) ? 'boleto' : /debito|compra no cartao/.test(nd) ? 'debito' : 'pix';

    const pm = desc.match(/parcela\s*(\d+)\s*\/\s*(\d+)/i);
    const cat = autoCat(desc.replace(/\s*-?\s*parcela.*$/i, ''), tipo) || (tipo === 'receita' ? (orig === 'va' ? 'Vale alimentação' : orig === 'vr' ? 'Vale refeição' : 'Outras receitas') : 'Outros');
    const it = {i, tipo, valor, desc:desc.replace(/\s+/g, ' ').trim(), data:x.data, mes, meio, cartaoId:cc ? cc.id : null, cat, ign, parc:pm ? `${pm[1]}/${pm[2]}` : ''};
    if (!ign) {
      const dup = S.lanc.find(l => !usados.has(l.id) && l.tipo === tipo && Math.abs(+l.valor - valor) < .015 && (cc ? l.cartaoId === cc.id && l.mes === fat : Math.abs(ddiff(l.data || '', x.data)) <= 3));

      else {
        const m = x.data.slice(0, 7);
        const fx = fixosAtivos(m).find(f => (f.tipo || 'despesa') === tipo && !pagoFixo(f, m) && !usados.has('f' + f.id) && (cc ? f.cartaoId === cc.id : !f.cartaoId) && Math.abs(valorFixo(f, m) - valor) <= Math.max(5, valorFixo(f, m) * .15) && (norm(f.desc).split(' ').some(w => w.length > 3 && nd.includes(w)) || Math.abs(valorFixo(f, m) - valor) < .5 || Math.abs(+x.data.slice(8) - diaFixo(f, m)) <= 4));

  });
}

const PERG = /\?\s*$|^\s*(quanto|qual|quais|onde|como|posso|quando|o que|me (diga|fala|mostra)|resum|devo|vale a pena|consigo|d[aá] pra|e se|se eu|compensa|ser[aá] que)/i;

const AI_OFF = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
async function aiParse(txt) {
  const cats = catsDesp().map(c => c.n), rcats = catsRec().map(c => c.n);
  const prompt = `Você converte mensagens em lançamentos de um controle financeiro pessoal brasileiro. Hoje é ${hoje()} (${new Date().toLocaleDateString('pt-BR', {weekday:'long'})}).
Mensagem: """${txt.slice(0, 2000)}"""
Categorias de despesa: ${JSON.stringify(cats)}
Categorias de receita: ${JSON.stringify(rcats)}
Cartões de crédito cadastrados: ${JSON.stringify(S.cartoes.map(c => c.nome))}
Formas de pagamento: pix, debito, va (vale alimentação), vr (vale refeição), dinheiro, boleto, credito.
Regras: um item por gasto ou receita citado. "valor" em reais como número (se for parcelado, o valor TOTAL). "data" em AAAA-MM-DD; interprete ontem, sexta etc. a partir de hoje; padrão hoje. "nparc" = número de parcelas (padrão 1). Se citar um cartão de crédito ou "crédito", use meio "credito" e "cartao" com o nome exato da lista; se citar débito, meio "debito" mesmo que cite o banco. Se não disser a forma de pagamento, meio null. "desc" curta, com inicial maiúscula. Salário, vale, PLR, 13º, férias, reembolso e dinheiro recebido são receitas.
Se a mensagem disser que é recorrente (todo mês, mensal, assinatura, recorrente, fixo), "recorrente": true; senão false.
Responda só com JSON: {"itens":[{"tipo":"despesa","valor":0,"desc":"","cat":"","data":"","meio":null,"cartao":null,"nparc":1,"recorrente":false}]}. Sem lançamentos na mensagem: {"itens":[]}.`;
  const r = await S.sample.json(prompt, {modelTier:'quick'});
  const itens = Array.isArray(r?.itens) ? r.itens : Array.isArray(r) ? r : [];
  return itens.map(it => {
    const tipo = it.tipo === 'receita' ? 'receita' : 'despesa';
    const valor = typeof it.valor === 'number' ? it.valor : parseValor(it.valor);
    if (!(valor > 0)) return null;
    const lista = (tipo === 'receita' ? catsRec() : catsDesp()).map(c => c.n);

function parseImport(txt) {
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean); if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : lines[0].includes(';') ? ';' : ',';
  const split = l => l.split(sep).map(s => s.trim().replace(/^"|"$/g, ''));
  let idx = {data:0, desc:1, valor:2, cat:3, tipo:-1};
  const h = split(lines[0]).map(norm);
  if (h.some(x => /data|descri|valor/.test(x))) {
    idx = {data:h.findIndex(x => /data/.test(x)), desc:h.findIndex(x => /descri|historico|item|nome/.test(x)), valor:h.findIndex(x => /valor|quantia|preco/.test(x)), cat:h.findIndex(x => /categ/.test(x)), tipo:h.findIndex(x => /^tipo/.test(x))};
    lines.shift();
  }
  const neg = lines.some(l => /^-/.test((split(l)[idx.valor] || '').replace(/[R$\s]/g, '')));
  const out = [];
  lines.forEach(l => {
    const c = split(l); let v = parseValor(c[idx.valor]); if (!v || isNaN(v)) return;
    let d = c[idx.data] || ''; let m;
    if ((m = d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) d = `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`;
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    let tipo = 'despesa';
    if (idx.tipo >= 0) tipo = /rec|entr|cred/.test(norm(c[idx.tipo])) ? 'receita' : 'despesa'; else if (neg) tipo = v < 0 ? 'despesa' : 'receita';
    v = Math.abs(v);
    const desc = (c[idx.desc] || '').trim() || 'Importado';
    const lista = tipo === 'receita' ? catsRec() : catsDesp();
    const catIn = idx.cat >= 0 ? lista.find(x => norm(x.n) === norm(c[idx.cat])) : null;
    out.push({tipo, valor:v, desc, data:d, cat:catIn ? catIn.n : (autoCat(desc, tipo) || (tipo === 'receita' ? 'Outras receitas' : 'Outros')), meio:'pix'});
  });
  return out;
}

  const parc = sum(S.lanc.filter(l => l.mes === m && l.grupo));
  const prompt = `Você é um planejador financeiro pessoal no Brasil, direto e prático. Analise o mês de ${ymLong(m)} de uma pessoa que está no limite do orçamento (não está endividada, mas sobra pouco) e quer gastar menos e guardar mais.
Receitas: ${brl(r.rec + r.pendR)} | Despesas lançadas: ${brl(r.desp)} | Contas ainda a pagar: ${brl(r.pendD)} | Guardado no mês: ${brl(r.guard)} | Meta de poupança: ${metaPoup()}%
Parcelas de cartão no mês: ${brl(parc)}
Despesas por categoria (com média dos meses anteriores):
${cats || '(sem despesas)'}
Contas fixas cadastradas:
${fixos || '(nenhuma)'}
Escreva em português do Brasil, em texto simples sem markdown, de 4 a 6 sugestões numeradas, curtas e concretas, com valores em reais estimados de economia por mês. Comece pelo que mais pesa. Termine com uma frase de qual deve ser o foco do próximo mês.`;
  S.aiBusy = true; S.aiText = ''; render();
  try {
    await S.sample(prompt, {cache:false, onText:({text}) => { S.aiText = text; const o = $('#ai-out'); if (o) { o.hidden = false; o.textContent = text; } }});
  } catch (e) {
    if (e?.code === 'rate_limited') toast('Muitas consultas agora. Tente daqui a pouco.');
    else if (['not_granted', 'sampling_disabled', 'not_declared'].includes(e?.code)) { S.sample = null; toast('Sem permissão para usar o Claude nesta página.'); }
    else toast('A análise não terminou. Tente de novo.');
    if (e?.text) S.aiText = e.text;
  }
  S.aiBusy = false; render();
};

const _autoFeito = new Set();
async function autoCredito() {
  if (!S.db || !S.canWrite || !Object.keys(COLS).every(k => S.loaded[k])) return;
  const T = hoje(), m0 = ymNow();
  for (const m of [addM(m0, -1), m0]) for (const f of fixosAtivos(m)) {
    const c = f.cartaoId && cartao(f.cartaoId); if (!c || f.tipo === 'receita') continue;
    const d = dataFixo(f, m), key = `auto-${f.id}-${m}`;
    if (d > T || pagoFixo(f, m) || _autoFeito.has(key) || S.lanc.some(l => l.id === key)) continue;
    _autoFeito.add(key);
    try { await put(COLS.lanc, key, {tipo:'despesa', valor:valorFixo(f, m), desc:f.desc, cat:f.cat || 'Assinaturas', data:d, mes:mesFatura(d, c), meio:'credito', cartaoId:c.id, fixoId:f.id, refMes:m, auto:true, criado:new Date().toISOString(), ...(S.uid ? {por:S.uid} : {})}); } catch (_) { _autoFeito.delete(key); return; }
  }
}
let _ids = '';
async function atualizarNomes() {
  if (!S.user) return;
  const ids = [...new Set(S.lanc.map(l => l.por).filter(Boolean))].sort(); const key = ids.join(',');
  if (!ids.length || key === _ids) return; _ids = key;
  try { const ps = await S.user.profiles(ids.slice(0, 64)); const out = {}; ids.forEach(id => { out[id] = ps?.[id]?.name || ''; }); S.nomes = out; render(); } catch (_) {}
}
function setSync(state, txt) { const d = $('#syncdot'); d.className = 'dot ' + state; $('#synctx').textContent = txt; }
async function init() {
  route();
  if (!window.claude || typeof window.claude.use !== 'function') { S.failed = true; setSync('err', 'Offline'); render(); return; }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db) { S.failed = true; setSync('err', 'Sem acesso aos dados'); render(); return; }
  if (user) { S.user = user; try { S.uid = await user.id(); } catch (_) {} try { const own = await user.isOwner(); if (own === false) { const w = await user.can('data.write'); if (w === false) S.blocked = true; } } catch (_) {} }
  S.db = db; render();
  const timer = setTimeout(() => setSync('wait', 'Sem resposta do servidor ainda'), 10000);
  let first = 0; const total = Object.keys(COLS).length + 1;
  const done = (k, snap) => { if (!S.loaded[k] && !snap.metadata.fromCache) { S.loaded[k] = true; first++; if (first >= total) { clearTimeout(timer); setSync('ok', 'Sincronizado'); } } };
  Object.entries(COLS).forEach(([k, col]) => {
    db.collection(col).onSnapshot(snap => { S[k] = snap.docs.map(d => ({id:d.id, ...d.data()})); if (k === 'lanc') { _learn = null; atualizarNomes(); } done(k, snap); render(); if (!snap.metadata.fromCache) setTimeout(autoCredito, 400); },
      e => { console.error(col, e); setSync('err', 'Erro ao sincronizar'); });
  });
  db.doc('config/geral').onSnapshot(snap => { S.cfg = snap.exists ? {...snap.data()} : {}; done('cfg', snap); render(); }, e => console.error('cfg', e));
  claude.use('sample').then(s => { S.sample = s; });
  claude.use('downloads').then(d => { S.dl = d; });
}
init();
})();
