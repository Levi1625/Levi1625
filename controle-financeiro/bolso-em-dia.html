<title>Bolso em Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: app de finanças pessoais — barra lateral no notebook, barra inferior + botão "+" no celular; cartões por função, números tabulares. */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#EEF2F0; --ink:#0F1B1A; --muted:#51605E; --line:#E3E8E6;
  --accent:#0F766E; --accent-soft:#E6F4F1; --on-accent:#FFFFFF;
  --pos:#047857; --pos-soft:#E6F4EA; --neg:#B42318; --neg-soft:#FDECEC; --warn:#B45309; --warn-soft:#FFF1E6;
  --hero:#0B3F3B; --mint:#5EEAD4; --guard:#3B5BDB; --guard-soft:#E8EEFD;
  --g-ess:#1D4ED0; --g-est:#D27A22; --g-fin:#B03558; --g-fut:#0D8C82;
  --shadow:0 1px 2px rgba(15,27,26,.06);
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1514; --surface:#12201E; --surface-2:#1A2B29; --ink:#E6EFEC; --muted:#9BB0AC; --line:#24403C;
  --accent:#2DD4BF; --accent-soft:#123A36; --on-accent:#06201D;
  --pos:#3FCB8F; --pos-soft:#0F3527; --neg:#FF7B69; --neg-soft:#3D1B17; --warn:#EFB351; --warn-soft:#382A10;
  --hero:#0E3532; --mint:#5EEAD4; --guard:#8EA5FF; --guard-soft:#1B2550;
  --g-ess:#7196FF; --g-est:#EF9F4C; --g-fin:#E46E8F; --g-fut:#36C3B6;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1514; --surface:#12201E; --surface-2:#1A2B29; --ink:#E6EFEC; --muted:#9BB0AC; --line:#24403C;
  --accent:#2DD4BF; --accent-soft:#123A36; --on-accent:#06201D;
  --pos:#3FCB8F; --pos-soft:#0F3527; --neg:#FF7B69; --neg-soft:#3D1B17; --warn:#EFB351; --warn-soft:#382A10;
  --hero:#0E3532; --mint:#5EEAD4; --guard:#8EA5FF; --guard-soft:#1B2550;
  --g-ess:#7196FF; --g-est:#EF9F4C; --g-fin:#E46E8F; --g-fut:#36C3B6;
  --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:1.6rem}
h2{font-size:1.05rem}
h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warnc{color:var(--warn)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:none}
main{min-width:0;padding-block:18px 120px;max-width:1180px;width:100%;margin-inline:auto}
@media (min-width:920px){
  .app{grid-template-columns:220px minmax(0,1fr);gap:28px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding-block:22px;overflow:auto}
  main{padding-block:26px 60px}
  .tabbar,.fab{display:none!important}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem}
.brand b{font-family:var(--f-display);font-size:1.05rem}
.nav-a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav-a svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav-a:hover{background:var(--surface-2)}
.nav-a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-a[aria-current="page"] svg{color:var(--accent)}
.nav-a.sec{font-size:.88rem;padding:7px 10px;color:var(--muted)}
.nav-sep{height:1px;background:var(--line);margin:10px 10px}
.side .btn{margin:6px 10px 10px}
.sync{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--pos)} .dot.wait{background:var(--warn)} .dot.err{background:var(--neg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer}
.tabbar svg{width:22px;height:22px}
.tabbar [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px rgba(29,78,208,.35);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
.fab{display:none!important}
.tabbar .tb-add{justify-self:center;align-self:start;width:58px;height:58px;margin-top:-22px;border-radius:29px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 20px rgba(29,78,208,.35);padding:0}
.tabbar .tb-add svg{width:28px;height:28px}
/* v2: barra flutuante, cartões arredondados, Hoje com anel */
.tabbar{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));border:0;border-radius:22px;box-shadow:0 6px 24px rgba(15,27,26,.14);padding:8px 6px;align-items:center}
.tabbar [aria-current="page"]{font-weight:700}
.tabbar .tb-add{width:56px;height:56px;margin-top:0;border-radius:18px;box-shadow:0 6px 16px rgba(15,118,110,.4)}
.card{border-color:transparent;border-radius:20px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{border-color:var(--line)}}
:root[data-theme="dark"] .card{border-color:var(--line)}
.btn{border-radius:12px}
.hd2{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hd2 .av{width:44px;height:44px;border-radius:22px;background:var(--hero);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.hd2 .tx{flex:1;min-width:0}.hd2 .tx small{display:block;font-size:.82rem;color:var(--muted)}.hd2 .tx b{font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.rb{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;padding:0}
.rb svg{width:20px;height:20px}
.hz{background:var(--hero);color:#fff;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.hz.s-pend{background:#7A3E06}.hz.s-bad{background:#7F1D1D}
.hero-top{display:flex;align-items:center;gap:16px}.hz .hero-top{justify-content:flex-start}@media (min-width:920px){.hz .hero-top{gap:32px}}
.ring{position:relative;width:132px;height:132px;flex:none}.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-family:var(--f-display);font-size:1.75rem;font-weight:800;line-height:1}.ring .in small{font-size:.75rem;opacity:.85}
.hero-r{display:flex;flex-direction:column;gap:4px;min-width:0}.hero-r small{font-size:.86rem;opacity:.85}
.hero-r .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.hero-r .mint{color:var(--mint);font-weight:600;font-size:.86rem}
.hero-r .lk{color:#fff;font-size:.86rem;opacity:.9;background:none;border:0;padding:0;text-align:left;text-decoration:underline;cursor:pointer}
.hero-m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero-m button{background:rgba(255,255,255,.1);border:0;border-radius:14px;padding:10px;color:#fff;text-align:left;cursor:pointer;font:inherit;min-width:0}
.hero-m small{display:block;font-size:.75rem;opacity:.8}.hero-m b{font-size:.98rem}.hero-m em{display:block;font-style:normal;font-size:.7rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec2{background:var(--surface);border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec2{border:1px solid var(--line)}}
:root[data-theme="dark"] .sec2{border:1px solid var(--line)}
.sec2-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.sec2-h h2{font-size:1.02rem;font-weight:700}.sec2-h .lnk{font-weight:600;font-size:.9rem}
.cnt{font-size:.78rem;color:#fff;background:#E8590C;border-radius:999px;padding:1px 8px;margin-left:6px;font-family:var(--f-body)}
.ri{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--surface-2);min-width:0}
.ri:first-of-type{border-top:0}
.ri .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.ri .t1{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}.ri .t2{font-size:.82rem;color:var(--muted)}
.ri .v{font-weight:700;white-space:nowrap}
.cic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.cic svg{width:20px;height:20px}
.cic.sm{width:36px;height:36px;border-radius:11px}.cic.sm svg{width:18px;height:18px}
.dt{width:40px;text-align:center;flex:none}.dt small{display:block;font-size:.68rem;font-weight:700;color:var(--muted)}.dt b{font-family:var(--f-display);font-size:1.1rem;font-weight:800}
.vbar{width:4px;height:34px;border-radius:2px;flex:none}
.okb{width:36px;height:36px;border-radius:18px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none}.okb svg{width:16px;height:16px}
.av1{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:12px;padding:12px;margin-top:8px;cursor:pointer;font:inherit;color:var(--ink)}
.av1 i{width:10px;height:10px;border-radius:5px;flex:none}.av1 .avt{flex:1;min-width:0}.av1.bad{background:var(--neg-soft)}.av1.bad i{background:var(--neg)}.av1.warn{background:var(--warn-soft)}.av1.warn i{background:var(--warn)}.av1.info{background:var(--guard-soft)}.av1.info i{background:var(--guard)}
.ob{display:flex;align-items:center;gap:12px;margin-top:12px}.ob .tx{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.ob .l1{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}.ob .l1 b{font-weight:600}
.ob .tr{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.ob .tr span{display:block;height:100%;border-radius:3px}
/* lançar com teclado */
.lk-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.seg3{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.seg3 button{border:0;border-radius:11px;padding:9px 0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.lk-val{text-align:center;padding:6px 0 2px}.lk-val small{font-size:.86rem;color:var(--muted)}
.lk-val b{display:block;font-family:var(--f-display);font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.lk-desc{width:100%;text-align:center;border:0;border-bottom:1px dashed var(--line);background:none;font:inherit;color:var(--muted);padding:6px 0;outline:none}
.lk-lbl{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:14px 0 8px}
.lk-cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lk-cats button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;font-size:.74rem;color:var(--muted);cursor:pointer;min-width:0}
.lk-cats button span.cic{width:52px;height:52px;border-radius:16px}.lk-cats button span.cic svg{width:24px;height:24px}
.lk-cats button[aria-pressed="true"]{color:var(--ink);font-weight:700}.lk-cats button[aria-pressed="true"] span.cic{background:var(--accent)!important;color:#fff!important}
.lk-cats em{font-style:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk-meio{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.lk-meio button{flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.lk-meio button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);font-weight:700}
.lk-kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.lk-kp button{height:52px;border-radius:14px;border:0;background:var(--surface-2);font-size:1.35rem;font-weight:600;color:var(--ink);cursor:pointer}
.lk-go{display:flex;gap:10px;margin-top:10px}
.lk-go .btn.pri{flex:1;min-height:56px;border-radius:18px;font-size:1.05rem}
.lk-go .rb{width:56px;height:56px;border-radius:18px}
.lk-res{margin-top:12px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mgrid a,.mgrid button{background:var(--surface-2);border:0;border-radius:18px;padding:14px 6px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.mgrid .cic{width:46px;height:46px;border-radius:15px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-h span{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal button{height:46px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font:inherit;color:var(--ink);padding:0}
.cal button.pass span{color:var(--muted)}.cal button.hoje{box-shadow:inset 0 0 0 2px var(--accent)}.cal button.hoje span{color:var(--accent);font-weight:800}
.cal button.sel{background:var(--hero)}.cal button.sel span{color:#fff;font-weight:800}
.cal i{display:flex;gap:2px;height:5px}.cal i em{width:5px;height:5px;border-radius:3px;display:block}
em.lg{display:inline-block;width:8px;height:8px;border-radius:4px;vertical-align:middle}
#pinlock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}
.pin-box{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pin-dots{display:flex;gap:14px;margin-top:6px}.pin-dots i{width:14px;height:14px;border-radius:7px;border:2px solid var(--accent)}.pin-dots i.on{background:var(--accent)}
.sw{width:46px;height:28px;border-radius:14px;position:relative;flex:none;border:0;cursor:pointer;background:#C7D0CD}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{left:21px}
body.sover .tb-add{visibility:hidden} body.sover form[data-f]:not([data-f="chat"]){display:none}
body.sover .btn[data-a]:not([data-a="instalarApp"]):not([data-a="instalarDepois"]):not([data-a="menu"]):not([data-a="closeSheet"]):not([data-a="objGuia"]):not([data-a="objRes"]):not([data-a="catDet"]):not([data-a="lugDet"]):not([data-a="fTipo"]):not([data-a="mes"]):not([data-a="mesHoje"]):not([data-a="irMes"]):not([data-a="irMesProj"]):not([data-a="projIr"]):not([data-a="projIr2"]):not([data-a="projTabelas"]):not([data-a="porDiaDet"]):not([data-a="projMes"]):not([data-a="ano"]):not([data-a="toggleMore"]):not([data-a="verHistorico"]):not([data-a="perguntaPronta"]):not([data-a="mic"]):not([data-a="sair"]):not([data-a="iaGastos"]):not([data-a="exportCSV"]):not([data-a="exportJSON"]):not([data-a="aiDicas"]),body.sover .lnk[data-a]:not([data-a="instalarApp"]):not([data-a="instalarDepois"]):not([data-a="menu"]):not([data-a="closeSheet"]):not([data-a="objGuia"]):not([data-a="objRes"]):not([data-a="catDet"]):not([data-a="lugDet"]):not([data-a="fTipo"]):not([data-a="mes"]):not([data-a="mesHoje"]):not([data-a="irMes"]):not([data-a="irMesProj"]):not([data-a="projIr"]):not([data-a="projIr2"]):not([data-a="projTabelas"]):not([data-a="porDiaDet"]):not([data-a="projMes"]):not([data-a="ano"]):not([data-a="toggleMore"]):not([data-a="verHistorico"]):not([data-a="perguntaPronta"]):not([data-a="mic"]):not([data-a="sair"]):not([data-a="iaGastos"]):not([data-a="exportCSV"]):not([data-a="exportJSON"]):not([data-a="aiDicas"]){display:none}
.hj-card{border-radius:22px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.hj-card.s-ok{background:#14532D}.hj-card.s-pend{background:#92400E}.hj-card.s-bad{background:#991B1B}.hj-card.s-info{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.hj-card .hj-l{margin:0;font-size:1rem;opacity:.92}
.hj-card .hj-v{font-family:var(--f-display);font-size:2.8rem;font-weight:700;line-height:1.05}
.hj-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.hj-mini button{background:rgba(255,255,255,.14);border:0;border-radius:14px;padding:10px 12px;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit}
.hj-mini span{font-size:.82rem;opacity:.9}.hj-mini b{font-size:1.15rem}
.fz{display:flex;flex-direction:column}
.fz-r{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fz-r:first-child{border-top:0;padding-top:4px}
.fz-r .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fz-r .t1{font-weight:600}.fz-r .t2{font-size:.86rem;color:var(--muted)}
.fz-r .btn{flex:none;min-height:44px}
.dia-b{flex:none;width:52px;border-radius:12px;text-align:center;padding:6px 0;background:var(--surface-2)}
.dia-b small{display:block;font-size:.7rem;font-weight:600;color:var(--muted)}.dia-b b{font-size:1.15rem}
.dia-b.hoje{background:#FEF3C7;color:#92400E}.dia-b.atras{background:#FEE2E2;color:#991B1B}
.pl-m{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}

}
function dbErr(e) {
  console.error(e);
  const c = e && e.code;
  if (c === 'invalid_argument') { S.canWrite = false; toast('Sem permissão para salvar aqui. Abra o controle logado na sua conta.'); }

async function put(col, id, data) {
  if (soVer()) { const e = new Error(AVISO_VER); e.code = 'permission_denied'; throw e; }
  if (!S.db) { toast('Ainda conectando aos seus dados…'); throw new Error('no db'); }
  const ref = id ? S.db.doc(`${col}/${id}`) : S.db.collection(col).doc();
  try { await ref.set(clean(data)); return ref.id; } catch (e) { dbErr(e); throw e; }
}
async function del(col, id) {

/* ================= regras de negócio ================= */
// mês da fatura em que a compra no crédito cai (mês do vencimento)
function mesFatura(data, c) {
  const [y, m, d] = data.split('-').map(Number);

  const fech = d >= F ? addM(ym, 1) : ym;
  return V > F ? fech : addM(fech, 1);
}
const ajusteFixo = (f, m) => (f.ajustes && f.ajustes[m]) || null;
const valorFixo = (f, m) => { const a = ajusteFixo(f, m); return a && a.v != null ? +a.v : +f.valor || 0; };

const empsAtivos = m => S.emps.filter(e => !e.quitado && e.inicio && e.inicio <= m && addM(e.inicio, (+e.n || 1) - 1) >= m);
const pagoFixo = (f, m) => S.lanc.find(l => l.fixoId === f.id && (l.refMes || l.mes) === m);
const pagoEmpL = (e, m) => S.lanc.find(l => l.empId === e.id && l.mes === m);

const empPagoNoMes = (e, m) => !!pagoEmpL(e, m) || parcNum(e, m) <= (+e.pagasAntes || 0);
function empPagas(e) {
  let n = 0; const N = +e.n || 0;
  for (let i = 0; i < N; i++) if (empPagoNoMes(e, addM(e.inicio, i))) n++;
  return n;
}

  const lanc = sum(S.lanc.filter(l => l.cartaoId === c.id && l.mes === m && l.tipo !== 'receita')), assin = fixosNaFatura(c, m);

}

  const v = Math.max(0, tirado - devolvido); if (v < 1) return null;
  const m = L.map(mv => mv.repor).sort().slice(-1)[0]; return {v, m, mes:m < ymNow() ? ymNow() : m};
}

const objPrevisto = o => sum(o.itens || [], it => +it.prev || 0);

  const L = S.lanc.filter(l => l.mes === m && !isRep(l));
  const D = L.filter(l => l.tipo !== 'receita'), R = L.filter(l => l.tipo === 'receita');

  const fixoD = sum(D.filter(isFixo));
  const parcD = sum(D.filter(l => (+l.nparc || 1) > 1 && !isFixo(l)));
  const pend = pendentesMes(m);
  const porCat = {}; D.forEach(l => { porCat[l.cat || 'Outros'] = (porCat[l.cat || 'Outros'] || 0) + (+l.valor || 0); });
  // dia a dia por categoria: mês da compra (no cartão, a compra conta no mês em que foi feita, não no da fatura)
  const porCatVar = {}; S.lanc.filter(l => mesGasto(l) === m && l.tipo !== 'receita' && !isRep(l) && !isFixo(l)).forEach(l => { porCatVar[l.cat || 'Outros'] = (porCatVar[l.cat || 'Outros'] || 0) + (+l.valor || 0); });
  const porGrupo = {essencial:0, estilo:0, financeiro:0};
  Object.entries(porCat).forEach(([c, v]) => { porGrupo[grupoDe(c)] = (porGrupo[grupoDe(c)] || 0) + v; });
  const vaRec = sum(R.filter(isVARec)) + sum(pend.filter(p => p.tipo === 'receita' && walletRec({cat:p.cat, meio:p.ref.meio}) !== 'conta'));

function parseImport(txt) {
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean); if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : lines[0].includes(';') ? ';' : ',';
  const split = l => l.split(sep).map(s => s.trim().replace(/^"|"$/g, ''));
  let idx = {data:0, desc:1, valor:2, cat:3, tipo:-1};
  const h = split(lines[0]).map(norm);
  if (h.some(x => /data|descri|valor/.test(x))) {
    idx = {data:h.findIndex(x => /data/.test(x)), desc:h.findIndex(x => /descri|historico|item|nome/.test(x)), valor:h.findIndex(x => /valor|quantia|preco/.test(x)), cat:h.findIndex(x => /categ/.test(x)), tipo:h.findIndex(x => /^tipo/.test(x))};
    lines.shift();
  }
  const neg = lines.some(l => /^-/.test((split(l)[idx.valor] || '').replace(/[R$\s]/g, '')));
  const out = [];
  lines.forEach(l => {
    const c = split(l); let v = parseValor(c[idx.valor]); if (!v || isNaN(v)) return;
    let d = c[idx.data] || ''; let m;
    if ((m = d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) d = `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`;
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    let tipo = 'despesa';
    if (idx.tipo >= 0) tipo = /rec|entr|cred/.test(norm(c[idx.tipo])) ? 'receita' : 'despesa'; else if (neg) tipo = v < 0 ? 'despesa' : 'receita';
    v = Math.abs(v);
    const desc = (c[idx.desc] || '').trim() || 'Importado';
    const lista = tipo === 'receita' ? catsRec() : catsDesp();
    const catIn = idx.cat >= 0 ? lista.find(x => norm(x.n) === norm(c[idx.cat])) : null;
    out.push({tipo, valor:v, desc, data:d, cat:catIn ? catIn.n : (autoCat(desc, tipo) || (tipo === 'receita' ? 'Outras receitas' : 'Outros')), meio:'pix'});
  });
  return out;
}
F.importar = async fm => { const r = parseImport(fm.t.value); if (!r.length) return toast('Não reconheci nenhuma linha. Confira o formato.'); const b = fm.querySelector('[type=submit]'); b.disabled = true;
  try { let i = 0; for (const o of r) { await criarLanc(o); i++; if (i % 10 === 0) b.textContent = `Importando ${i}/${r.length}…`; } toast(`${r.length} lançamentos importados`); closeSheet(); } catch (_) { b.disabled = false; } };

A.aiDicas = async () => {
  if (!S.sample) { toast('A análise com o Claude não está disponível nesta tela.'); return; }
  const m = S.mes, r = resumo(m), med = mediaCat(m);
  const cats = Object.entries(r.porCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `- ${c}: ${brl(v)} (média ${brl(med.media[c] || 0)})`).join('\n');
  const fixos = fixosAtivos(m).filter(f => f.tipo !== 'receita').map(f => `- ${f.desc} (${f.cat}): ${brl(f.valor)}`).join('\n');
  const parc = sum(S.lanc.filter(l => l.mes === m && l.grupo));
  const prompt = `Você é um planejador financeiro pessoal no Brasil, direto e prático. Analise o mês de ${ymLong(m)} de uma pessoa que está no limite do orçamento (não está endividada, mas sobra pouco) e quer gastar menos e guardar mais.
Receitas: ${brl(r.rec + r.pendR)} | Despesas lançadas: ${brl(r.desp)} | Contas ainda a pagar: ${brl(r.pendD)} | Guardado no mês: ${brl(r.guard)} | Meta de poupança: ${metaPoup()}%
Parcelas de cartão no mês: ${brl(parc)}
Despesas por categoria (com média dos meses anteriores):
${cats || '(sem despesas)'}
Contas fixas cadastradas:
${fixos || '(nenhuma)'}
Escreva em português do Brasil, em texto simples sem markdown, de 4 a 6 sugestões numeradas, curtas e concretas, com valores em reais estimados de economia por mês. Comece pelo que mais pesa. Termine com uma frase de qual deve ser o foco do próximo mês.`;
  S.aiBusy = true; S.aiText = ''; render();
  try {
    await S.sample(prompt, {cache:false, onText:({text}) => { S.aiText = text; const o = $('#ai-out'); if (o) { o.hidden = false; o.textContent = text; } }});
  } catch (e) {
    if (e?.code === 'rate_limited') toast('Muitas consultas agora. Tente daqui a pouco.');
    else if (['not_granted', 'sampling_disabled', 'not_declared'].includes(e?.code)) { S.sample = null; toast('Sem permissão para usar o Claude nesta página.'); }
    else toast('A análise não terminou. Tente de novo.');
    if (e?.text) S.aiText = e.text;
  }
  S.aiBusy = false; render();
};

const _autoFeito = new Set();
async function autoCredito() {
  if (soVer()) return;
  if (!S.db || !S.canWrite || !Object.keys(COLS).every(k => S.loaded[k])) return;
  const T = hoje(), m0 = ymNow();
  for (const m of [addM(m0, -1), m0]) for (const f of fixosAtivos(m)) {
    const c = f.cartaoId && cartao(f.cartaoId); if (!c || f.tipo === 'receita') continue;
    const d = dataFixo(f, m), key = `auto-${f.id}-${m}`;
    if (d > T || pagoFixo(f, m) || _autoFeito.has(key) || S.lanc.some(l => l.id === key)) continue;
    _autoFeito.add(key);
    try { await put(COLS.lanc, key, {tipo:'despesa', valor:valorFixo(f, m), desc:f.desc, cat:f.cat || 'Assinaturas', data:d, mes:mesFatura(d, c), meio:'credito', cartaoId:c.id, fixoId:f.id, refMes:m, auto:true, criado:new Date().toISOString(), ...(S.uid ? {por:S.uid} : {})}); } catch (_) { _autoFeito.delete(key); return; }
  }
}
let _ids = '';
async function atualizarNomes() {
  if (!S.user) return;
  const ids = [...new Set(S.lanc.map(l => l.por).filter(Boolean))].sort(); const key = ids.join(',');
  if (!ids.length || key === _ids) return; _ids = key;
  try { const ps = await S.user.profiles(ids.slice(0, 64)); const out = {}; ids.forEach(id => { out[id] = ps?.[id]?.name || ''; }); S.nomes = out; render(); } catch (_) {}
}
function setSync(state, txt) { const d = $('#syncdot'); d.className = 'dot ' + state; $('#synctx').textContent = txt; }
async function init() {
  aplicarTema(); pinVerificar(); route();
  if (!window.claude || typeof window.claude.use !== 'function') { S.failed = true; setSync('err', 'Offline'); render(); return; }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db) { S.failed = true; setSync('err', 'Sem acesso aos dados'); render(); return; }
  if (user) { S.user = user; try { S.uid = await user.id(); } catch (_) {} if (!PRIV) try { const own = await user.isOwner(); if (own === false) { const w = await user.can('data.write'); if (w === false) S.blocked = true; } } catch (_) {} }
  if (PRIV) { if (!S.uid) { S.failed = true; setSync('err', 'Entre na sua conta para usar'); render(); return; } P = `data/users/${S.uid}/app/`; Object.keys(COLS).forEach(k => { COLS[k] = P + COLS[k]; }); }
  S.db = db; render();
  const timer = setTimeout(() => setSync('wait', 'Sem resposta do servidor ainda'), 10000);
  let first = 0; const total = Object.keys(COLS).length + 1;
  const done = (k, snap) => { if (!S.loaded[k] && !snap.metadata.fromCache) { S.loaded[k] = true; first++; if (first >= total) { clearTimeout(timer); setSync('ok', 'Sincronizado'); } } };
  Object.entries(COLS).forEach(([k, col]) => {
    db.collection(col).onSnapshot(snap => { S[k] = snap.docs.map(d => ({id:d.id, ...d.data()})); if (k === 'lanc') { _learn = null; atualizarNomes(); } done(k, snap); render(); if (!snap.metadata.fromCache) setTimeout(autoCredito, 400); },
      e => { console.error(col, e); setSync('err', 'Erro ao sincronizar'); });
  });
  db.doc(P + 'config/geral').onSnapshot(snap => { S.cfg = snap.exists ? {...snap.data()} : {}; done('cfg', snap); render(); }, e => console.error('cfg', e));
  claude.use('sample').then(s => { S.sample = s; });
  try { if (sessionStorage.getItem('bolso:atualizou')) { sessionStorage.removeItem('bolso:atualizou'); setTimeout(() => toast('App atualizado para a versão nova ✅'), 800); } } catch (_) {}
  if (window.__admin) { atualizarCred(); setInterval(atualizarCred, 60000); }
  claude.use('downloads').then(d => { S.dl = d; });
  claude.use('dictation').then(d => { if (d) ligarDitado(d); });
}
init();
})();
